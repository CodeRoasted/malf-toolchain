name: 'CodeRoast CI'
description: |
  The whole build half of a CodeRoast C++ CI job, as ONE step: checkout + the gcc-16.2 toolchain +
  the canonical build env (apt / CMake 4.3.x / Conan / dep-binary cache / profile) + the cross-repo
  Conan vendor loop (data manifest) + a fresh build.log + the per-module build/test/create loop.

  Kills the copy-pasted checkout / setup / vendor / module-build boilerplate that previously lived in
  every consumer repo. The vendor loop is the shared `coderoast-vendor` action (single-sources the
  fetch script); the per-module build logic is shared from the sibling `conan-module` action.

  Use it as the FIRST (usually only) build step in the job. `runs-on` and `permissions` stay in the
  caller — they are job-level keys a composite action cannot hold. Follow this step with a
  `coderoast-ci-sift` step for the advisory Sift dogfood (kept separate so the caller can set
  `continue-on-error` on it — the advisory guarantee cannot be enforced from inside a composite).

inputs:
  vendor:
    description: |
      Newline-separated cross-repo Conan deps to restore before the build, one per row:
        <pkg> <version> <owner/repo> <public|private> [release-tag]
      `public` deps resolve with `github-token`; `private` deps use `release-token`. release-tag
      defaults to v<version>. `#` starts a comment. Blank / omitted = no vendoring (a tower-root repo).
    required: false
    default: ''
  deps:
    description: |
      How the `vendor` rows reach the cache — `vendor` (their release tarballs) or `build` (each
      created from its repository's `main`). Passed to coderoast-vendor, which refuses rows with no
      declared `deps`; see its description for the two paths.
    required: false
    default: ''
  modules:
    description: |
      Newline-separated modules to build in order, one per row:
        <module> [test] [create] [cmake-args...]
      module is a path relative to the repo root (`core`, `.`, `infra/redis`, `sift`). `test` and
      `create` default to `true`; set either to `false` to skip that phase (e.g. leaf binaries build
      + test but do not `conan create`: `sift true false`). Any fields AFTER create are extra cmake
      configure flags for the test build, e.g. `core true true -DPKG_BUILD_TESTS=ON` (for packages that
      gate their unit tests behind a flag). `#` starts a comment.
    required: true
  extra-apt:
    description: 'Extra apt packages for setup-build-env (e.g. "libpq-dev redis-tools postgresql-client").'
    required: false
    default: ''
  github-token:
    description: 'Token for PUBLIC-repo release reads — pass secrets.GITHUB_TOKEN. Required only if any vendor row is `public`.'
    required: false
    default: ''
  release-token:
    description: 'Token for PRIVATE-repo release reads — pass secrets.CR_RELEASE_TOKEN. Required only if any vendor row is `private`.'
    required: false
    default: ''
  hub-scenarios:
    description: |
      'true' to `conan export` the content-only `insight_scenarios` recipe from the PUBLIC coderoast-hub
      after `modules` and before `late-modules` (a test_requires of the late modules). The hub commit is
      the one the release recorded on a tag run (`hub-ref`, refused when absent — never hub `main`)
      and `main` off a tag: `checkout_release_hub.sh` beside this file owns the rule and its why.
    required: false
    default: 'false'
  hub-ref:
    description: 'The coderoast-hub commit the release build record verified (the attest job''s `hub` output). Read only on a tag run.'
    required: false
    default: ''
  late-modules:
    description: 'Modules built AFTER the hub export, same grammar as `modules` (a module that test_requires insight_scenarios).'
    required: false
    default: ''
  fetch-depth:
    description: 'Checkout fetch-depth. 0 (full history) is required for the Sift baseline resolution.'
    required: false
    default: '0'
  profile:
    description: 'Conan profile name (in malf-toolchain profiles/) to install and build with.'
    required: false
    default: 'linux-gcc16-release'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Provision the pinned gcc toolchain (published asset; never the PPA)
      uses: CodeRoasted/malf-toolchain/.github/actions/setup-gcc@c2f54808a7c4fef81a0bb96a2f854869276cbbd6

    - name: Setup build env (apt + CMake 4.3.x + Conan + dep cache + canonical profile)
      uses: CodeRoasted/malf-toolchain/.github/actions/setup-build-env@c2f54808a7c4fef81a0bb96a2f854869276cbbd6
      with:
        extra-apt: ${{ inputs.extra-apt }}
        profile: ${{ inputs.profile }}

    - name: Vendor cross-repo Conan deps
      uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-vendor@c2f54808a7c4fef81a0bb96a2f854869276cbbd6
      with:
        vendor: ${{ inputs.vendor }}
        deps: ${{ inputs.deps }}
        profile: ${{ inputs.profile }}
        github-token: ${{ inputs.github-token }}
        release-token: ${{ inputs.release-token }}

    - name: Start build.log capture (fresh, AFTER vendoring so Sift diffs only the build+test output)
      shell: bash
      run: ': > "$GITHUB_WORKSPACE/build.log"'

    - name: Build + test + create the modules
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
        PROFILE_NAME: ${{ inputs.profile }}
        # NOT SET HERE, deliberately: MALF_LOCKFILE / MALF_LOCKFILE_PARTIAL and MALF_TOOLCHAIN_DIR.
        # conan_module.sh derives all three from its own location — it is the one path every module
        # goes through, here, in `late-modules` and in the `conan-module` action — and
        # `setup-build-env` exports MALF_TOOLCHAIN_DIR job-wide by the same derivation for the bare
        # `conan create` of `coderoast-release.yml`. A copy here would be a second encoding that rots.
      run: bash "$GITHUB_ACTION_PATH/build_modules.sh" "$PROFILE_NAME" <<< "$MODULES"

    - name: Export insight_scenarios from the public coderoast-hub (the release's recorded commit on a tag)
      if: inputs.hub-scenarios == 'true'
      shell: bash
      env:
        REF_TYPE: ${{ github.ref_type }}
        HUB_REF: ${{ inputs.hub-ref }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/checkout_release_hub.sh" "$REF_TYPE" "$HUB_REF" "$RUNNER_TEMP/coderoast-hub"
        conan export "$RUNNER_TEMP/coderoast-hub/insight-playground"

    - name: Build + test + create the late modules (after the hub export)
      if: inputs.late-modules != ''
      shell: bash
      env:
        MODULES: ${{ inputs.late-modules }}
        PROFILE_NAME: ${{ inputs.profile }}
      run: bash "$GITHUB_ACTION_PATH/build_modules.sh" "$PROFILE_NAME" <<< "$MODULES"
