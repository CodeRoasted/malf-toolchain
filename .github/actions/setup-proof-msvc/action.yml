name: 'Setup an MSVC leg (Windows)'
description: |
  The provisioning half of every CodeRoast MSVC leg — the brick insight-canon's, insight-metalog's
  and insight-eidos's golden `proof-msvc` legs and insight-eidos's `sift-windows` build share; they
  keep only WHAT they build and prove. MSVC 14.52 installed, activated and verified equal to the
  pinned toolset; CMake 4.3.x and Ninja; Conan; zstd; the restore of a keyed conan cache; the MSVC conan
  profile staged from a malf-toolchain checkout.

  ONE FORM FOR BOTH RUNNER KINDS. The org variable WINDOWS_RUNNER routes a private repository's
  Windows leg to our self-hosted Windows runners, which lack CMake, Ninja, Conan and zstd; the hosted
  image has some of them. Every install here is pwsh: CMake, Ninja and Conan from setup-build-env's
  hash locks into a job-scoped venv, zstd fetched only where it is missing. The cache steps are
  `bash`, which on a Windows runner is Git bash from `C:\Program Files\Git\bin`: the self-hosted
  runners have it only through their job PATH (malf runner/README.md, Windows runner). The runner
  itself is the CALLER's job-level `runs-on` — a composite holds no runner, so this brick can never
  pin one.

  THE CACHE IS RESTORE-ONLY HERE. Save it with `conan-cache-save` as the job's LAST step, which drops
  the first-party packages first (ROADMAP N367). The restore and the save live under the caller's
  CONAN_HOME, whose absolute path is part of the cache `version`, so a hosted run and a self-hosted
  run never read each other's entries: each runner kind warms its own.

inputs:
  conan-home:
    description: 'The CONAN_HOME of this leg.'
    required: true
  cache-key:
    description: 'The exact cache key (the caller computes it with hashFiles over its dependency set).'
    required: true
  cache-restore-key:
    description: 'The prefix a miss falls back to.'
    required: true
  profile:
    description: 'The conan profile to stage from `<malf-dir>/profiles`.'
    required: false
    default: 'windows-msvc-release'
  global-conf:
    description: "'true' stages `<malf-dir>/global.conf` into CONAN_HOME, over any copy a restored home carries."
    required: false
    default: 'false'
  malf-dir:
    description: 'Where the caller checked malf-toolchain out (relative to the workspace).'
    required: false
    default: 'malf'
  conan-version:
    description: 'The Conan version the leg runs.'
    required: false
    default: '2.29.0'

runs:
  using: composite
  steps:
    - name: Install + activate MSVC 14.52 (the C++23-modules fix floor; not pre-installed)
      uses: CodeRoasted/malf-toolchain/.github/actions/setup-msvc1452@2bb5f15be7f62c6371bb912d7ced18430320057a

    - name: Verify the active toolset is exactly MSVC 14.52, neither a fallback nor a newer one
      # EQUALITY, NEVER A MINIMUM (RUL-154): a `>= 14.52` check passes a 14.53 the Insiders channel
      # moved to. The major.minor is setup-msvc1452's `toolset` default, held equal by
      # tests/test_proof_bricks.sh.
      shell: pwsh
      run: |
        if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Error "cl.exe not on PATH — MSVC env not activated"; exit 1 }
        if (-not $env:VCToolsVersion) { Write-Error "VCToolsVersion not set — MSVC env not activated"; exit 1 }
        $active = ($env:VCToolsVersion -split '\.')[0..1] -join '.'
        if ($active -ne '14.52') { Write-Error "active toolset $env:VCToolsVersion is not 14.52 (the pinned toolset)"; exit 1 }
        Write-Host "active VCToolsVersion: $env:VCToolsVersion"

    - name: CMake 4.3.x, Ninja and Conan from their hash locks, into a job-scoped venv
      # EVERY FILE PIP INSTALLS IS ONE OF THE DIGESTS THE LOCKS PIN (`--require-hashes`), AND NOTHING
      # IS BUILT FROM SOURCE (`--only-binary=:all:`): the locks are setup-build-env's, where the Linux
      # legs read theirs (ROADMAP N281). CMake 4.3.x because the import-std gate UUID 451f2fe2 lives
      # only there. The venv lives in RUNNER_TEMP and dies with the job: an install into the runner's
      # own Python would persist on a self-hosted Windows runner and be executed by every later job
      # of every repository (W295's finding on the Linux runners). Only the five launchers reach
      # PATH, through a directory of their own, so the job's `python` is still the runner's; a pip
      # launcher names its venv's python.exe by absolute path, so a copy runs from anywhere. A
      # conan version with no lock refuses: there is no unhashed fallback. `python -S` makes the
      # venv without running the runner Python's .pth files (setup-build-env/tool-venv.sh says why).
      shell: pwsh
      env:
        CONAN_VERSION: ${{ inputs.conan-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $lockDir = Join-Path $env:GITHUB_ACTION_PATH '../setup-build-env'
        $locks = @('cmake-4.3.1.txt', 'ninja-1.13.2.txt', "conan-$env:CONAN_VERSION.txt") | ForEach-Object { Join-Path $lockDir $_ }
        foreach ($lock in $locks) {
          if (-not (Test-Path -LiteralPath $lock)) { Write-Error "no hash lock at ${lock}: write it as setup-build-env/conan-2.28.1.txt's header says, never install unhashed"; exit 1 }
        }
        $venv = Join-Path $env:RUNNER_TEMP 'proof-tools-venv'
        $bin = Join-Path $env:RUNNER_TEMP 'proof-tools-bin'
        Remove-Item -Recurse -Force -LiteralPath $venv, $bin -ErrorAction SilentlyContinue
        python -S -m venv $venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $pipArgs = @('-m', 'pip', 'install', '--disable-pip-version-check', '--no-input', '--require-hashes', '--only-binary=:all:')
        foreach ($lock in $locks) { $pipArgs += @('-r', $lock) }
        & (Join-Path $venv 'Scripts/python.exe') @pipArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force -Path $bin | Out-Null
        foreach ($tool in 'cmake', 'ctest', 'cpack', 'ninja', 'conan') {
          Copy-Item -LiteralPath (Join-Path $venv "Scripts/$tool.exe") -Destination (Join-Path $bin "$tool.exe")
        }
        "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        $v = (& (Join-Path $bin 'cmake.exe') --version | Select-Object -First 1)
        if ($v -notmatch ' 4\.3\.') { Write-Error "expected CMake 4.3.x (got: $v)"; exit 1 }
        & (Join-Path $bin 'cmake.exe') --version; & (Join-Path $bin 'ninja.exe') --version; & (Join-Path $bin 'conan.exe') --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: zstd, digest-pinned (without it actions/cache falls back to MSYS2 tar -z, whose gzip child is absent, and the save fails)
      shell: pwsh
      run: |
        if (Get-Command zstd -ErrorAction SilentlyContinue) { Write-Host "zstd present: $(zstd --version)"; exit 0 }
        $ver = '1.5.6'
        $zip = "$env:RUNNER_TEMP/zstd.zip"
        Invoke-WebRequest -Uri "https://github.com/facebook/zstd/releases/download/v$ver/zstd-v$ver-win64.zip" -OutFile $zip
        # The release publishes no digest for this zip, so the pin is the bytes first fetched on
        # 2026-10-12 (1708727 bytes; GitHub's asset record unchanged since 2024-03-29T07:13:12Z).
        $want = '7b4eff6719990e38aca93a4844c2e86a1935090625c4611f7e89675e999c56cc'
        $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
        if ($got -ne $want) { Write-Error "zstd-v$ver-win64.zip sha256 $got is not the pinned $want"; exit 1 }
        Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/zstd" -Force
        $dir = (Get-ChildItem -Recurse "$env:RUNNER_TEMP/zstd" -Filter zstd.exe | Select-Object -First 1).DirectoryName
        if (-not $dir) { Write-Error 'zstd.exe not found in the downloaded archive'; exit 1 }
        "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        & "$dir/zstd.exe" --version

    - name: May this job touch an Actions cache? (never on the coderoast-release group)
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-build-env/actions-cache-allowed.sh"

    - name: Restore the leg's conan cache
      id: restore
      if: steps.guard.outputs.allowed == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.conan-home }}
        key: ${{ inputs.cache-key }}
        restore-keys: |
          ${{ inputs.cache-restore-key }}

    - name: Drop every first-party package the restore brought (ROADMAP N367)
      if: ${{ steps.restore.outputs.cache-matched-key != '' }}
      shell: bash
      env:
        HOME_DIR: ${{ inputs.conan-home }}
      run: bash "$GITHUB_ACTION_PATH/../setup-build-env/drop-first-party.sh" "$HOME_DIR"

    - name: Record the restore for conan-cache-save
      shell: bash
      env:
        CONAN_HOME_DIR: ${{ inputs.conan-home }}
        CACHE_KEY: ${{ inputs.cache-key }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        ALLOWED: ${{ steps.guard.outputs.allowed }}
      run: bash "$GITHUB_ACTION_PATH/../setup-build-env/conan-cache-state.sh" write "$CONAN_HOME_DIR" "$CACHE_KEY" "${CACHE_HIT:-false}" "$ALLOWED"

    - name: Stage the conan profile (+ global.conf on request)
      shell: pwsh
      env:
        HOME_DIR: ${{ inputs.conan-home }}
        PROFILE_NAME: ${{ inputs.profile }}
        GLOBAL_CONF: ${{ inputs.global-conf }}
        MALF_DIR: ${{ inputs.malf-dir }}
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path "$env:HOME_DIR/profiles" | Out-Null
        Copy-Item "$env:MALF_DIR/profiles/$env:PROFILE_NAME" "$env:HOME_DIR/profiles/$env:PROFILE_NAME"
        # OVERWRITTEN, never kept: a restored home's older global.conf would shadow a policy change
        # (and lack the conf naming the recipe-exports helper, failing every export) — the reason
        # malf's conf sync and setup-build-env overwrite theirs.
        if ($env:GLOBAL_CONF -eq 'true') {
          Copy-Item "$env:MALF_DIR/global.conf" "$env:HOME_DIR/global.conf" -Force
        }
        # global.conf names the path-map fragment (ROADMAP N366) and the recipe-exports helper
        # (DN-142.D4 (b)) inside the home: a home that has the one must have the others, whichever
        # run staged global.conf.
        if ($env:GLOBAL_CONF -eq 'true') {
          Copy-Item "$env:MALF_DIR/cmake/malf-path-map.cmake" "$env:HOME_DIR/malf-path-map.cmake"
          Copy-Item "$env:MALF_DIR/malf_recipe_exports.py" "$env:HOME_DIR/malf_recipe_exports.py"
          Copy-Item "$env:MALF_DIR/malf_recipe_tests.py" "$env:HOME_DIR/malf_recipe_tests.py"
        }

    - name: Register malf's recipe overlay as the first remote (DN-142.D17 (8))
      # The lock pins three overlay revisions; a home without the remote cannot resolve them. pwsh,
      # not the Linux brick's register-overlay.sh: that script sources malf, which no Windows leg
      # has ever loaded under Git bash. The ONE second spelling of `_malf_sync_overlay_remote`
      # (malf/malf), held equal to it by tests/test_proof_bricks.sh: name, type, URL
      # `<malf checkout>/overlay`, first.
      shell: pwsh
      env:
        HOME_DIR: ${{ inputs.conan-home }}
        MALF_DIR: ${{ inputs.malf-dir }}
      run: |
        $ErrorActionPreference = 'Stop'
        $overlay = Join-Path (Resolve-Path $env:MALF_DIR).Path 'overlay'
        if (Test-Path (Join-Path $overlay 'recipes')) {
          $env:CONAN_HOME = $env:HOME_DIR
          conan remote add malf-overlay $overlay --type local-recipes-index --index 0 --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
