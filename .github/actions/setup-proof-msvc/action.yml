name: 'Setup an MSVC leg (Windows)'
description: |
  The provisioning half of every CodeRoast MSVC leg — the brick insight-canon's, insight-metalog's
  and insight-eidos's golden `proof-msvc` legs and insight-eidos's `sift-windows` build share; they
  keep only WHAT they build and prove. MSVC 14.52 installed, activated and verified against the fix
  floor; CMake 4.3.x and Ninja; Conan; zstd; the restore of a keyed conan cache; the MSVC conan
  profile staged from a malf-toolchain checkout.

  ONE FORM FOR BOTH RUNNER KINDS. The org variable WINDOWS_RUNNER routes a private repository's
  Windows leg to our self-hosted Windows runners, which lack CMake, Ninja, Conan and zstd; the hosted
  image has some of them. Every install here is pwsh and pip, never `bash` (on the self-hosted host
  `bash` resolves to WSL) and never conan-io/setup-conan (a bash action), and each is a no-op or a
  fresh install on either kind. The runner itself is the CALLER's job-level `runs-on` — a composite
  holds no runner, so this brick can never pin one.

  THE CACHE IS RESTORE-ONLY HERE. Save it with `conan-cache-save` as the job's LAST step, which drops
  the first-party packages first (ROADMAP N367). The restore and the save live under the caller's
  CONAN_HOME, whose absolute path is part of the cache `version`, so a hosted run and a self-hosted
  run never read each other's entries: each runner kind warms its own.

inputs:
  conan-home:
    description: 'The CONAN_HOME of this leg.'
    required: true
  cache-key:
    description: 'The exact cache key (the caller computes it with hashFiles over its dependency set).'
    required: true
  cache-restore-key:
    description: 'The prefix a miss falls back to.'
    required: true
  profile:
    description: 'The conan profile to stage from `<malf-dir>/profiles`.'
    required: false
    default: 'windows-msvc-release'
  global-conf:
    description: "'true' stages `<malf-dir>/global.conf` into CONAN_HOME, over any copy a restored home carries."
    required: false
    default: 'false'
  malf-dir:
    description: 'Where the caller checked malf-toolchain out (relative to the workspace).'
    required: false
    default: 'malf'
  conan-version:
    description: 'The Conan version the leg runs.'
    required: false
    default: '2.29.0'

runs:
  using: composite
  steps:
    - name: Install + activate MSVC 14.52 (the C++23-modules fix floor; not pre-installed)
      uses: CodeRoasted/malf-toolchain/.github/actions/setup-msvc1452@a73bffa9aa9155527d15adeeac91b86fd31bba9c

    - name: Verify the active toolset is MSVC 14.52, not a fallback
      shell: pwsh
      run: |
        if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { Write-Error "cl.exe not on PATH — MSVC env not activated"; exit 1 }
        if (-not $env:VCToolsVersion) { Write-Error "VCToolsVersion not set — MSVC env not activated"; exit 1 }
        if ([version]$env:VCToolsVersion -lt [version]'14.52') { Write-Error "active toolset $env:VCToolsVersion < 14.52 (the fix floor)"; exit 1 }
        Write-Host "active VCToolsVersion: $env:VCToolsVersion"

    - name: CMake 4.3.x + Ninja (pip; the import-std gate UUID 451f2fe2 lives only in 4.3.x)
      shell: pwsh
      run: |
        python -m pip install --disable-pip-version-check "cmake==4.3.1" "ninja>=1.12"
        $v = (cmake --version | Select-Object -First 1)
        if ($v -notmatch ' 4\.3\.') { Write-Error "expected CMake 4.3.x (got: $v)"; exit 1 }
        cmake --version; ninja --version

    - name: Conan (pip)
      shell: pwsh
      env:
        CONAN_VERSION: ${{ inputs.conan-version }}
      run: |
        python -m pip install --disable-pip-version-check "conan==$env:CONAN_VERSION"
        conan --version

    - name: zstd (without it actions/cache falls back to MSYS2 tar -z, whose gzip child is absent, and the save fails)
      shell: pwsh
      run: |
        if (Get-Command zstd -ErrorAction SilentlyContinue) { Write-Host "zstd present: $(zstd --version)"; exit 0 }
        $ver = '1.5.6'
        $zip = "$env:RUNNER_TEMP/zstd.zip"
        Invoke-WebRequest -Uri "https://github.com/facebook/zstd/releases/download/v$ver/zstd-v$ver-win64.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/zstd" -Force
        $dir = (Get-ChildItem -Recurse "$env:RUNNER_TEMP/zstd" -Filter zstd.exe | Select-Object -First 1).DirectoryName
        if (-not $dir) { Write-Error 'zstd.exe not found in the downloaded archive'; exit 1 }
        "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        & "$dir/zstd.exe" --version

    - name: May this job touch an Actions cache? (never on the coderoast-release group)
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-build-env/actions-cache-allowed.sh"

    - name: Restore the leg's conan cache
      id: restore
      if: steps.guard.outputs.allowed == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.conan-home }}
        key: ${{ inputs.cache-key }}
        restore-keys: |
          ${{ inputs.cache-restore-key }}

    - name: Drop every first-party package the restore brought (ROADMAP N367)
      if: ${{ steps.restore.outputs.cache-matched-key != '' }}
      shell: bash
      env:
        HOME_DIR: ${{ inputs.conan-home }}
      run: bash "$GITHUB_ACTION_PATH/../setup-build-env/drop-first-party.sh" "$HOME_DIR"

    - name: Record the restore for conan-cache-save
      shell: bash
      env:
        CONAN_HOME_DIR: ${{ inputs.conan-home }}
        CACHE_KEY: ${{ inputs.cache-key }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        ALLOWED: ${{ steps.guard.outputs.allowed }}
      run: bash "$GITHUB_ACTION_PATH/../setup-build-env/conan-cache-state.sh" write "$CONAN_HOME_DIR" "$CACHE_KEY" "${CACHE_HIT:-false}" "$ALLOWED"

    - name: Stage the conan profile (+ global.conf on request)
      shell: pwsh
      env:
        HOME_DIR: ${{ inputs.conan-home }}
        PROFILE_NAME: ${{ inputs.profile }}
        GLOBAL_CONF: ${{ inputs.global-conf }}
        MALF_DIR: ${{ inputs.malf-dir }}
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path "$env:HOME_DIR/profiles" | Out-Null
        Copy-Item "$env:MALF_DIR/profiles/$env:PROFILE_NAME" "$env:HOME_DIR/profiles/$env:PROFILE_NAME"
        # OVERWRITTEN, never kept: a restored home's older global.conf would shadow a policy change
        # (and lack the conf naming the recipe-exports helper, failing every export) — the reason
        # malf's conf sync and setup-build-env overwrite theirs.
        if ($env:GLOBAL_CONF -eq 'true') {
          Copy-Item "$env:MALF_DIR/global.conf" "$env:HOME_DIR/global.conf" -Force
        }
        # global.conf names the path-map fragment (ROADMAP N366) and the recipe-exports helper
        # (DN-142.D4 (b)) inside the home: a home that has the one must have the others, whichever
        # run staged global.conf.
        if ($env:GLOBAL_CONF -eq 'true') {
          Copy-Item "$env:MALF_DIR/cmake/malf-path-map.cmake" "$env:HOME_DIR/malf-path-map.cmake"
          Copy-Item "$env:MALF_DIR/malf_recipe_exports.py" "$env:HOME_DIR/malf_recipe_exports.py"
          Copy-Item "$env:MALF_DIR/malf_recipe_tests.py" "$env:HOME_DIR/malf_recipe_tests.py"
        }
