name: 'Setup CodeRoast build env'
description: |
  The shared C++ build environment every CodeRoast repo's CI uses, as ONE step: apt base +
  the pinned CMake 4.3.x + Conan (no profile autodetect) + the conan dep-binary cache + the
  canonical conan profile fetched from THIS toolchain repo (single source — no per-repo
  vendored `linux-gcc16-release` copy).

  Run AFTER `setup-gcc` (the profile pins CC/CXX=/opt/gcc-16.2/bin/...). This replaces the
  inlined 5-step block (Setup environment → Setup Conan → Cache → Setup Conan profile) that
  was copy-pasted across every consumer CI. Consumers add repo-specific apt via `extra-apt`.

  Owns `CONAN_HOME` (exported to `$GITHUB_ENV` as <workspace>/.conan2) so consumers no longer
  declare it at job level; later steps (conan-module, etc.) read it as `$CONAN_HOME`.

  Also owns `MALF_TOOLCHAIN_DIR` for the COMPOSITE path (see the step below). Do NOT re-declare
  either variable in a caller — a per-caller copy of a toolchain-layout fact is two places
  encoding one thing, one of which rots.

inputs:
  extra-apt:
    description: 'Extra apt packages (space-separated), e.g. "libpq-dev redis-tools postgresql-client".'
    required: false
    default: ''
  conan-version:
    description: 'Conan version to install.'
    required: false
    default: '2.28.1'
  profile:
    description: 'Conan profile (in this repo''s profiles/) to install into $CONAN_HOME/profiles.'
    required: false
    default: 'linux-gcc16-release'

runs:
  using: composite
  steps:
    - name: apt base + pinned CMake 4.3.x; export CONAN_HOME
      shell: bash
      env:
        EXTRA_APT: ${{ inputs.extra-apt }}
      run: |
        set -euo pipefail
        # CONAN_HOME owned here (single definition) — visible to every later step as $CONAN_HOME.
        echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan2" >> "$GITHUB_ENV"
        # Idempotent on a persistent (self-hosted) runner: apt state survives between jobs, so the
        # apt/pip provision is pure waste AND needs sudo → a password prompt on a self-hosted box.
        # Install only what's actually missing; on a hosted (ephemeral) runner everything is missing
        # so the full provision still runs.
        need_apt=0
        for pkg in ninja-build python3-pip build-essential $EXTRA_APT; do
          dpkg -s "$pkg" >/dev/null 2>&1 || { need_apt=1; break; }
        done
        if [ "$need_apt" = 1 ]; then
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip build-essential $EXTRA_APT
        else
          echo "apt base (+ extra: '${EXTRA_APT:-none}') already present — skipping apt (idempotent skip)"
        fi
        # Pin the dev-validated CMake 4.3.x workspace-wide (dev/CI parity). Repos that arm
        # `import std` need CXX_MODULE_STD (experimental UUID 451f2fe2 — present only in CMake
        # 4.3.x); Ubuntu Noble ships 3.28 without that gate. Install only if not already 4.3.x
        # (the pip install needs sudo → skip it when the pin is already satisfied).
        case "$(cmake --version 2>/dev/null | head -1)" in
          *" 4.3."*) ;;
          *) sudo python3 -m pip install --break-system-packages "cmake==4.3.1"; hash -r ;;
        esac
        case "$(cmake --version | head -1)" in
          *" 4.3."*) cmake --version ;;
          *) echo "::error::expected CMake 4.3.x (got: $(cmake --version | head -1))"; exit 1 ;;
        esac

    - name: Setup Conan ${{ inputs.conan-version }}
      uses: conan-io/setup-conan@v1
      with:
        version: ${{ inputs.conan-version }}
        home: ${{ env.CONAN_HOME }}
        cache_packages: false
        profile_detect: false

    - name: Declare MALF_TOOLCHAIN_DIR (build-time codegen reachability, job-wide)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # MALF_TOOLCHAIN_DIR is the generator's RESOLUTION MECHANISM, not a convenience
        # (DN-17.D31/D32): a package that cannot find its build-time generator FATALs — it never
        # degrades and never probes a second candidate. Its relative fallback anchors on the DESK
        # layout alone and is unreachable under `conan create`, which builds from sources exported
        # into the conan cache. CI is the environment that can declare, so it declares.
        #
        # WHY HERE, when `conan_module.sh` already exports it. That script is the single source
        # of truth for PER-MODULE build logic, and the claim written at its site — "it is the one
        # thing every path goes through" — is false for exactly one live path: this repo's own
        # `coderoast-release.yml` runs a bare `conan create` in a `run:` block, never through
        # conan_module.sh, so the release job of EVERY consumer repo built with the variable unset.
        # `setup-build-env` is the step that path does run, before any build. Both derive the same
        # absolute path from the same fact (this action's own location inside the pinned
        # malf-toolchain checkout under `_actions/`), and conan_module.sh's `:-` default means the
        # value exported here WINS rather than competing — so this is one fact with one derivation
        # rule, not the per-caller hard-coded copy that action banner forbids.
        #
        # The five golden determinism legs declare it a third time, at job level, and that IS a
        # deliberate duplicate: DN-17.D32 keeps those legs RAW so the byte-identity compare cannot
        # inherit this wiring's assumptions.
        #
        # `$GITHUB_ACTION_PATH` is `<runner>/work/_actions/<owner>/<repo>/<ref>/.github/actions/
        # setup-build-env`, so `../../..` is the toolchain repo root — the same arithmetic this
        # action already uses to read `profiles/`, `global.conf` and `settings_user.yml`, and the
        # same one conan_module.sh uses. Observed in a real run log (coderoast-web
        # src/assets/sift-showcase/logcraft__ci-build__green-b.log:564).
        toolchain_root="$(cd -- "$ACTION_PATH/../../.." && pwd)"
        echo "MALF_TOOLCHAIN_DIR=$toolchain_root" >> "$GITHUB_ENV"
        echo "MALF_TOOLCHAIN_DIR=$toolchain_root"

    - name: Stage the canonical conan profile (single source — from malf-toolchain)
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # The profile + global.conf live ONCE in this toolchain repo (no per-repo vendored copy).
        # Stage both into the workspace under .malf-toolchain/ so the cache key below hashes them
        # (hashFiles is workspace-relative); they are installed into $CONAN_HOME in the step after
        # cache. global.conf carries the package_id policy — hashing it means a policy change (e.g.
        # a package_id mode) BUSTS the binary cache (its package_ids are recomputed anyway), and the
        # post-cache install below OVERWRITES a stale cached copy. Without this a PERSISTENT/restored
        # conan home shadows the policy forever (the stale-binary ABI-skew segfault, 2026-07-10).
        mkdir -p "$GITHUB_WORKSPACE/.malf-toolchain"
        cp "$ACTION_PATH/../../../profiles/$PROFILE" "$GITHUB_WORKSPACE/.malf-toolchain/$PROFILE"
        cp "$ACTION_PATH/../../../global.conf" "$GITHUB_WORKSPACE/.malf-toolchain/global.conf"
        # settings_user.yml rides the same single-source pipeline: compiler versions newer than
        # the pinned conan (the from-source gcc legs) must validate on a FRESH hosted cache too.
        cp "$ACTION_PATH/../../../settings_user.yml" "$GITHUB_WORKSPACE/.malf-toolchain/settings_user.yml"

    - name: Cache conan dep binaries (keyed on the dep set + the gcc-16.2 profile)
      uses: actions/cache@v5
      with:
        path: ${{ env.CONAN_HOME }}
        key: conan-gcc162-${{ runner.os }}-${{ hashFiles('**/conanfile.py', '.malf-toolchain/*') }}
        restore-keys: |
          conan-gcc162-${{ runner.os }}-

    - name: Install the conan profile + global.conf into $CONAN_HOME
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        mkdir -p "$CONAN_HOME/profiles"
        cp "$GITHUB_WORKSPACE/.malf-toolchain/$PROFILE" "$CONAN_HOME/profiles/$PROFILE"
        # OVERWRITE global.conf + settings_user.yml from the source of truth — a cache-restored home
        # may carry stale copies (seeded before the current policy). This is the CI counterpart of the
        # malf script's _malf_sync_conan_conf; the package_id policy must always match the in-tree
        # global.conf, and the compiler-version extensions must validate on any cache vintage.
        cp "$GITHUB_WORKSPACE/.malf-toolchain/global.conf" "$CONAN_HOME/global.conf"
        cp "$GITHUB_WORKSPACE/.malf-toolchain/settings_user.yml" "$CONAN_HOME/settings_user.yml"
