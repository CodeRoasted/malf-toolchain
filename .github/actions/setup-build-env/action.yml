name: 'Setup CodeRoast build env'
description: |
  The shared C++ build environment every CodeRoast repo's CI uses, as ONE step: apt base + CMake
  4.3.x + Conan from their hash locks into a job-scoped venv (no profile autodetect) + the conan
  dep-binary cache + the canonical conan profile fetched from THIS toolchain repo (single source —
  no per-repo vendored `linux-gcc16-release` copy).

  Run AFTER `setup-gcc` (the profile pins CC/CXX=/opt/gcc-16.2/bin/...). This replaces the
  inlined 5-step block (Setup environment → Setup Conan → Cache → Setup Conan profile) that
  was copy-pasted across every consumer CI. Consumers add repo-specific apt via `extra-apt`.

  Owns `CONAN_HOME` (exported to `$GITHUB_ENV`) so consumers no longer declare it at job level;
  later steps read it as `$CONAN_HOME`. It is <workspace>/.conan2, which
  `actions/cache/restore` fills and `conan-cache-save` (the caller's last step) saves without its
  first-party packages, on any runner group but `coderoast-release` (`actions-cache-allowed.sh`), unless the caller asks for `persistent-conan-home`: one home
  per self-hosted runner, outside the checkout, that outlives the job (`conan-home.sh` says why and
  where). A caller that asks for it also runs `clean-conan-homes.sh` at its job's end.

  Also owns `MALF_TOOLCHAIN_DIR` for the COMPOSITE path and `MALF_LOCKFILE_STRICT` (see the steps
  below), and lifts a hosted runner's user-namespace restriction for every test path of the job. Do NOT re-declare any of them in a caller — a per-caller copy of a toolchain-layout fact is two places
  encoding one thing, one of which rots.

inputs:
  extra-apt:
    description: 'Extra apt packages (space-separated), e.g. "libpq-dev redis-tools postgresql-client".'
    required: false
    default: ''
  conan-version:
    description: 'Conan version to install.'
    required: false
    default: '2.28.1'
  profile:
    description: 'Conan profile (in this repo''s profiles/) to install into $CONAN_HOME/profiles.'
    required: false
    default: 'linux-gcc16-release'
  persistent-conan-home:
    description: >-
      'true': CONAN_HOME is this self-hosted runner's own home under the runner user's HOME,
      outside the checkout, and it outlives the job, so no Actions cache is restored or saved. It is
      handed out only on a runner in the `coderoast-release` group whose user runs no other runner
      and owns every entry of the home; anything else refuses (conan-home.sh says why), so the
      caller grants `actions: read` and runs clean-conan-homes.sh at job end. 'false': the
      checkout's .conan2, restored by actions/cache/restore and saved by conan-cache-save.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: apt base; export CONAN_HOME
      shell: bash
      env:
        EXTRA_APT: ${{ inputs.extra-apt }}
        PERSISTENT: ${{ inputs.persistent-conan-home }}
        ACTION_PATH: ${{ github.action_path }}
        JOB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # CONAN_HOME owned here (single definition) — visible to every later step as $CONAN_HOME.
        # WHERE it is, and why a persistent one lives where it does, is conan-home.sh's header. The
        # job's token reaches conan-home.sh alone (it reads this job's runner group), and is unset
        # before the apt install below runs anything.
        conan_home="$(GH_TOKEN="$JOB_TOKEN" bash "$ACTION_PATH/conan-home.sh" "$PERSISTENT")"
        unset JOB_TOKEN
        echo "CONAN_HOME=$conan_home" >> "$GITHUB_ENV"
        echo "CONAN_HOME=$conan_home (persistent: $PERSISTENT)"
        # Idempotent on a persistent (self-hosted) runner: apt state survives between jobs, so the
        # apt provision is pure waste AND needs sudo → a password prompt on a self-hosted box.
        # Install only what's actually missing; on a hosted (ephemeral) runner everything is missing
        # so the full provision still runs.
        # patchelf is in the base because a published executable's package() runs it
        # (`patchelf --remove-rpath`, DN-142.D20 (3)) and artefact_store's key measures it in the
        # toolchain member: a create of coderoast_server or insight_sift_tools, and every
        # `malf store-create`, fails on a seat without it. Every hosted Ubuntu image ships it.
        need_apt=0
        for pkg in ninja-build python3-pip build-essential patchelf $EXTRA_APT; do
          dpkg -s "$pkg" >/dev/null 2>&1 || { need_apt=1; break; }
        done
        if [ "$need_apt" = 1 ]; then
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip build-essential patchelf $EXTRA_APT
        else
          echo "apt base (+ extra: '${EXTRA_APT:-none}') already present — skipping apt (idempotent skip)"
        fi
        echo "patchelf: $(command -v patchelf) — $(patchelf --version)"

    - name: Lift a hosted runner's AppArmor restriction on unprivileged user namespaces (tests that need one run)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      # Every test path of the job, a workflow's own bare `conan create` included, runs after this
      # action, so the lift is here once (the script says why).
      run: bash "$ACTION_PATH/lift-userns-restriction.sh"

    - name: CMake 4.3.x and Conan ${{ inputs.conan-version }} from their hash locks, into a job-scoped venv
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONAN_VERSION: ${{ inputs.conan-version }}
      # tool-venv.sh is the one install path of both (its header says why a venv, why the locks, and
      # what it replaced). Repos that arm `import std` need CXX_MODULE_STD, the experimental gate
      # UUID 451f2fe2 that only CMake 4.3.x carries; Ubuntu Noble ships 3.28 without it.
      run: bash "$ACTION_PATH/tool-venv.sh" "$CONAN_VERSION"

    - name: Declare MALF_TOOLCHAIN_DIR (build-time codegen reachability, job-wide)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # MALF_TOOLCHAIN_DIR is the generator's RESOLUTION MECHANISM, not a convenience
        # (DN-17.D31, DN-17.D32): a package that cannot find its build-time generator FATALs — it never
        # degrades and never probes a second candidate. Its relative fallback anchors on the DESK
        # layout alone and is unreachable under `conan create`, which builds from sources exported
        # into the conan cache. CI is the environment that can declare, so it declares.
        #
        # WHY HERE: a workflow's own bare `conan create` in a `run:` block (eidos's
        # `sift-windows.yml`) builds with whatever this job
        # exports; until 2026-10-16 the release job of every consumer repository built that way with
        # the variable unset. `setup-build-env` is the step every such path does run, before any
        # build, and it derives the path from one fact (this action's own location inside the pinned
        # malf-toolchain checkout under `_actions/`), never a per-caller hard-coded copy.
        #
        # The five golden determinism legs declare it a third time, at job level, and that IS a
        # deliberate duplicate: DN-17.D32 keeps those legs RAW so the byte-identity compare cannot
        # inherit this wiring's assumptions.
        #
        # `$GITHUB_ACTION_PATH` is `<runner>/work/_actions/<owner>/<repo>/<ref>/.github/actions/
        # setup-build-env`, so `../../..` is the toolchain repo root — the same arithmetic this
        # action already uses to read `profiles/`, `global.conf` and `settings_user.yml`. Observed in
        # a real run log (coderoast-web
        # src/assets/sift-showcase/logcraft__ci-build__green-b.log:564).
        toolchain_root="$(cd -- "$ACTION_PATH/../../.." && pwd)"
        echo "MALF_TOOLCHAIN_DIR=$toolchain_root" >> "$GITHUB_ENV"
        echo "MALF_TOOLCHAIN_DIR=$toolchain_root"

    - name: Declare MALF_LOCKFILE_STRICT (every malf verb of the job resolves strictly against conan.lock)
      shell: bash
      run: |
        set -euo pipefail
        # ADR-4.D2: the desk pins, CI GATES. malf passes `--lockfile-partial` unless this variable is
        # set, and partial lets a requirement the lock does not name resolve freely against the home.
        # Until 2026-10-10 nothing in CI set it, so every malf verb a job ran after this action (`malf
        # bench` in a release's measure step among them) resolved partial. Measured that day,
        # conan 2.28.1: all 31 workspace roots resolve strictly under all 7 malf/profiles/ profiles.
        echo "MALF_LOCKFILE_STRICT=1" >> "$GITHUB_ENV"

    - name: Stage the canonical conan profile (single source — from malf-toolchain)
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # The profile + global.conf live ONCE in this toolchain repo (no per-repo vendored copy).
        # Stage both into the workspace under .malf-toolchain/ so the cache key below hashes them
        # (hashFiles is workspace-relative); after the cache, install-home.sh installs the same
        # files into $CONAN_HOME from this tree. global.conf carries the package_id policy — hashing
        # it means a policy change (e.g. a package_id mode) BUSTS the binary cache (its package_ids
        # are recomputed anyway), and the post-cache install below OVERWRITES a stale cached copy. Without this a PERSISTENT/restored
        # conan home shadows the policy forever (the stale-binary ABI-skew segfault, 2026-07-10).
        mkdir -p "$GITHUB_WORKSPACE/.malf-toolchain"
        cp "$ACTION_PATH/../../../profiles/$PROFILE" "$GITHUB_WORKSPACE/.malf-toolchain/$PROFILE"
        cp "$ACTION_PATH/../../../global.conf" "$GITHUB_WORKSPACE/.malf-toolchain/global.conf"
        # settings_user.yml rides the same single-source pipeline: compiler versions newer than
        # the pinned conan (the from-source gcc legs) must validate on a FRESH hosted cache too.
        cp "$ACTION_PATH/../../../settings_user.yml" "$GITHUB_WORKSPACE/.malf-toolchain/settings_user.yml"
        # global.conf names the path-map fragment (ROADMAP N366), the recipe-exports helper
        # (DN-142.D4 (b)) and the test helper (DN-142.D5) inside the home: all three ride along.
        cp "$ACTION_PATH/../../../cmake/malf-path-map.cmake" "$GITHUB_WORKSPACE/.malf-toolchain/malf-path-map.cmake"
        cp "$ACTION_PATH/../../../malf_recipe_exports.py" "$GITHUB_WORKSPACE/.malf-toolchain/malf_recipe_exports.py"
        cp "$ACTION_PATH/../../../malf_recipe_tests.py" "$GITHUB_WORKSPACE/.malf-toolchain/malf_recipe_tests.py"
        # and the notices helper with the one SPDX reader it imports from its own folder (DN-142.D39).
        cp "$ACTION_PATH/../../../third_party_notices.py" "$GITHUB_WORKSPACE/.malf-toolchain/third_party_notices.py"
        cp "$ACTION_PATH/../../../spdx_licence.py" "$GITHUB_WORKSPACE/.malf-toolchain/spdx_licence.py"

    - name: The cache key, computed ONCE, before the restore
      id: key
      # The restored home lands in the checkout and carries conanfile.py files of its own, so
      # `**/conanfile.py` hashed after the restore names another key than the one restored.
      if: ${{ inputs.persistent-conan-home != 'true' }}
      shell: bash
      run: echo "key=conan-gcc162-${{ runner.os }}-${{ hashFiles('**/conanfile.py', '.malf-toolchain/*') }}" >> "$GITHUB_OUTPUT"

    - name: May this job touch an Actions cache? (never on the coderoast-release group)
      id: guard
      # A persistent home is its own cache: restoring over it would re-download what it holds, and
      # saving it would upload it again (DN-119.D2 measured both at about 510 s a run).
      if: ${{ inputs.persistent-conan-home != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/actions-cache-allowed.sh"

    - name: Restore the conan dep binaries (keyed on the dep set + the gcc-16.2 profile)
      id: restore
      if: ${{ steps.guard.outputs.allowed == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CONAN_HOME }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          conan-gcc162-${{ runner.os }}-

    - name: Drop every first-party package the restore brought (ROADMAP N367)
      if: ${{ steps.restore.outputs.cache-matched-key != '' }}
      shell: bash
      env:
        HOME_DIR: ${{ env.CONAN_HOME }}
      run: bash "$GITHUB_ACTION_PATH/drop-first-party.sh" "$HOME_DIR"

    - name: Record the restore for conan-cache-save
      # RESTORE-ONLY: the job saves with `conan-cache-save` as its LAST step, which drops every
      # first-party package first (ROADMAP N367): a post-step save would carry them.
      if: ${{ inputs.persistent-conan-home != 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CACHE_KEY: ${{ steps.key.outputs.key }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        ALLOWED: ${{ steps.guard.outputs.allowed }}
      run: bash "$ACTION_PATH/conan-cache-state.sh" write "$CONAN_HOME" "$CACHE_KEY" "${CACHE_HIT:-false}" "$ALLOWED"

    - name: Drop every editable registry the cache just restored — the base home's and each keyed one's
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      # The why, the measurements and the scope are the script's header.
      run: bash "$ACTION_PATH/drop-editable-registries.sh"

    - name: Install malf's home files and EVERY registry profile into $CONAN_HOME
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      # malf's own home sync, never a second copy of it: the why is the script's header. The staged
      # .malf-toolchain/ copies above feed only the cache key.
      run: bash "$ACTION_PATH/install-home.sh" "$CONAN_HOME"
