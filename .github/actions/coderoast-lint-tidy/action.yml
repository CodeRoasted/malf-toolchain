name: 'CodeRoast clang-tidy lint'
description: |
  `malf lint --all-files` (clang-tidy) over the caller repo's SHIPPING C++ sources, in the same job
  as `malf format --check`. Founder ruling 2026-08-30: "lint and format go together, because adding
  nolint and stuff tend to break formatting" — a `NOLINT` insertion reflows the line it is added to,
  so the two questions are coupled at the point of repair and ONE run has to answer both. Split
  across workflows or triggers, a lint fix passes the run that executed and breaks the one that did
  not, and the author learns later or never.

  WHY THIS COSTS A BUILD, stated here because the workflow that calls it was designed on the
  opposite premise. clang-tidy needs a compile database AND, on this module-first codebase, the
  clang module BMIs (.pcm) the database's commands reference. Neither exists without a real
  compile. `malf format --check` needs neither — clang-format parses each file alone — which is why
  the two source gates were deliberately separated until this ruling reversed the split. So this
  action carries the whole build stack the format gate does not need: CMake + Conan and a
  clang-21/libc++ build of every package in the repo.

  THE TOOLCHAIN IS clang-21, NOT the gcc-16 ship leg, and that is not a preference. `malf lint`
  REFUSES a database whose entries were produced by another compiler, because clang-tidy reading a
  gcc database emits findings that are well-formed and wrong — real rule ids, real lines, real
  symbols (measured 2026-08-26: 10 findings on a clean file, 4 of them naming a real rule at a real
  line; 0 after re-indexing against clang). The consequence is a cost, not a detail: conan binaries
  are package_id-keyed on the compiler, so the published gcc-16 binary cache warms nothing here and
  the third-party closure is built from source.

  IT IS NOW THREE ACTIONS IN ONE JOB, so the repositories still calling `coderoast-lint.yml` keep
  this exact behaviour while the per-repository workflows call the parts on their own:
  `coderoast-dev-build` (the clang-21 build, `test: false` here), `coderoast-postflight` (clang-tidy
  over that build, which builds nothing and refuses without it; its description carries the ARMING)
  and `coderoast-dev-cleanup` (the editable registry and the sibling workspace, always). Siblings
  and the clang-21 provisioning are `coderoast-dev-build`'s; read its description for both.

inputs:
  clang-tidy-major:
    description: 'Required clang-tidy major version. Must match the build clang; a different major does not merely differ, it produces findings that read as defects.'
    required: false
    default: '21'
  profile:
    description: 'malf profile to build the lint database with. Must be a clang profile — `malf lint` refuses any other database.'
    required: false
    default: 'linux-clang21-libcxx-release'
  siblings:
    description: |
      CodeRoasted repos to clone from source beside this one, whitespace-separated: the first-party
      build closure minus the repo's own packages. Empty (the default) keeps the checkout as the
      workspace. Each follows the run's ref — the same tag name on a tag event (a cut tags upstream
      waves first), `main` otherwise — unless written `<repo>@<ref>`. A ref that does not resolve
      FAILS naming it: a fallback would lint against a revision nobody chose.
    required: false
    default: ''
  checkout-token:
    description: 'Read-only Contents token for PRIVATE siblings. Leave empty when every sibling is public — a public caller is never handed one.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: The clang-21 build clang-tidy reads (compile commands + module BMIs)
      uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-dev-build@8fba54b0e251e74f7176906934f36f695c26a75f
      with:
        clang-tidy-major: ${{ inputs.clang-tidy-major }}
        profile: ${{ inputs.profile }}
        test: 'false'
        siblings: ${{ inputs.siblings }}
        checkout-token: ${{ inputs.checkout-token }}

    - name: clang-tidy over that build
      uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-postflight@8fba54b0e251e74f7176906934f36f695c26a75f
      with:
        clang-tidy-major: ${{ inputs.clang-tidy-major }}

    - name: Clear the editable registry and the sibling workspace
      if: always()
      uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-dev-cleanup@8fba54b0e251e74f7176906934f36f695c26a75f
