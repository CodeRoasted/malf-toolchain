name: 'Setup pinned gcc toolchain'
description: |
  Provision the from-source gcc that the CodeRoast dev profile uses, by downloading the
  PUBLIC release asset published by this repo's build-gcc-toolchain.yml and extracting it
  to /opt/gcc-<maj.min> — so a repo-local `linux-gcc*-release` conan profile
  (CC/CXX=/opt/gcc-<maj.min>/bin/...) resolves it.

  Fully derived from `tag` (default = the CURRENT ship toolchain, the ONE bump point):
  version, install prefix, and per-ISA asset name all come from it — no per-version action,
  no version enumeration to rot. Every published asset is ≥15.3 (the PR124309 floor; the
  build workflow refuses to publish below it — see build-gcc-toolchain.yml).

  The release is PUBLIC, so the download is anonymous: NO token, NO ghcr, NO packages:read.
  Usable by both public and private consumer repos (public->public / private->public), with
  no dependency on any private repo.

inputs:
  tag:
    description: |
      Release tag holding the toolchain asset (gcc-MAJOR.MINOR.PATCH). The default IS the
      current ship toolchain — a gcc bump edits this one default; consumers follow @main.
    required: false
    default: 'gcc-16.2.0'
  asset:
    description: |
      Toolchain tarball asset name. Default (empty) derives it from `tag` + the runner's ISA
      (`uname -m`): x86_64 → `-x64`, aarch64 → `-arm64`. Set explicitly only to pin a non-default asset.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download + verify + extract pinned gcc → /opt (public release, no token)
      shell: bash
      env:
        REPO: CodeRoasted/malf-toolchain
        TAG: ${{ inputs.tag }}
        ASSET: ${{ inputs.asset }}
      run: |
        set -euo pipefail
        # Everything derives from TAG: gcc-16.2.0 → ver=16.2.0, mm=16.2, PREFIX=/opt/gcc-16.2.
        case "$TAG" in
          gcc-[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::setup-gcc: tag '$TAG' is not gcc-MAJOR.MINOR.PATCH"; exit 1 ;;
        esac
        ver="${TAG#gcc-}"; mm="${ver%.*}"
        PREFIX="/opt/gcc-${mm}"
        # Derive the per-ISA asset name from the runner's architecture unless the caller pinned one.
        # The build workflow publishes gcc-<maj.min>-noble-{x64,arm64}.tar.zst as siblings on the same
        # gcc-<ver> release; pick the one matching THIS runner so a single action serves both ISAs.
        if [ -z "${ASSET:-}" ]; then
          case "$(uname -m)" in
            x86_64|amd64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::setup-gcc: unsupported arch '$(uname -m)' (no published asset for it)"; exit 1 ;;
          esac
          ASSET="gcc-${mm}-noble-${arch}.tar.zst"
          echo "setup-gcc: ISA $(uname -m) → asset ${ASSET}"
        fi
        # Idempotent on a persistent (self-hosted) runner: $PREFIX survives between jobs, so a
        # re-provision (download + `sudo tar -C /opt`) is pure waste AND needs sudo — which prompts
        # for a password on a self-hosted box (the runner user is not in passwordless sudoers). Skip
        # when the compiler is already present at the tag's maj.min (the prefix is version-keyed, so
        # same-prefix == same maj.min); the first provision installs.
        if [ -x "$PREFIX/bin/g++" ]; then
          have=$("$PREFIX/bin/g++" -dumpversion 2>/dev/null || echo 0)
          case "$have" in
            "$mm"*) echo "gcc $have already at $PREFIX — skipping provision (idempotent skip)"; exit 0 ;;
          esac
        fi
        base="https://github.com/${REPO}/releases/download/${TAG}"
        cd "$RUNNER_TEMP"
        # Retry the pull: the toolchain layer is ~450 MB and the CDN occasionally drops the
        # connection mid-download. Wipe partials between attempts so the checksum can't pass
        # on a truncated file.
        pulled=""
        for attempt in 1 2 3; do
          rm -f "$ASSET" "$ASSET.sha256" 2>/dev/null || true
          if curl -fsSL -o "$ASSET" "${base}/${ASSET}" \
             && curl -fsSL -o "$ASSET.sha256" "${base}/${ASSET}.sha256"; then pulled=1; break; fi
          echo "::warning::toolchain download failed (attempt ${attempt}/3) — retrying after backoff"
          sleep $((attempt * 10))
        done
        [ -n "$pulled" ] || { echo "::error::toolchain download failed after 3 attempts (network)"; exit 1; }
        # Verify the published checksum before trusting the archive.
        sha256sum -c "$ASSET.sha256"
        command -v zstd >/dev/null 2>&1 || sudo apt-get install -y zstd
        sudo tar -C /opt -I zstd -xf "$ASSET"
        # Confirm the provisioned compiler matches the tag's maj.min.
        v=$("$PREFIX/bin/g++" -dumpversion)
        echo "Provisioned gcc $v at $PREFIX (from ${REPO}@${TAG})"
        case "$v" in "$mm"*) ;; *) echo "::error::$PREFIX reports gcc $v, expected ${mm}.x from $TAG"; exit 1 ;; esac
