name: CodeRoast golden compare

# The determinism golden's verdict, as a reusable workflow: download every leg's
# `golden-digest-*` artifact of THIS run, require them byte-identical through the
# `coderoast-golden-compare` action, and upload the agreed digest as `determinism-golden` — the
# artifact `coderoast-attach-golden.yml` publishes. One body for every engine's `golden.yaml`
# (canon, metalog, eidos) instead of one copy each. The proof legs that produce the digests stay
# in the callers: each engine proves a different harness.
#
# THE PRODUCER-SIDE CONFORMANCE GATE IS AN INPUT, NOT A FORK. A caller that publishes MetaLog
# documents (insight-metalog) passes `spec-ref`: the job then checks out the caller at the run's
# commit and metalog-spec at that ref, installs the validator's pinned requirements, and runs the
# caller's own `scripts/spec_conformance_gate.sh` over the agreed golden BETWEEN the compare and the
# upload — so a nonconformant golden never becomes an artifact at all, and no path (not even
# "download it from the failed run") brings those bytes to a reader. The gate's logic stays a
# committed script in the caller, the one instrument the desk and this job both run; its exit codes
# are the validator's, unmerged (1 = schema-invalid documents, 2 = the gate could not run honestly).

on:
  workflow_call:
    inputs:
      min-legs:
        description: 'How many leg digests must be present and byte-identical.'
        type: string
        required: true
      spec-ref:
        description: 'metalog-spec ref for the producer-side SPEC §8 conformance gate (insight-metalog). Empty = no conformance gate.'
        type: string
        required: false
        default: ''
      runs-on:
        description: 'Runner label. PUBLIC callers MUST omit it (hosted ubuntu-latest) — a self-hosted runner reachable from a fork PR is an RCE.'
        type: string
        required: false
        default: 'ubuntu-latest'

jobs:
  compare:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      # Checked out FIRST: this action cleans its destination, and `digests/` lands here below.
      # The checkout is what lets the conformance gate rebuild the section roster from the corpus
      # files on disk instead of carrying a hand-kept list of them.
      - name: Check out the caller (the conformance gate's script and corpus roster)
        if: ${{ inputs.spec-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The STANDARD the producer declares it writes against, plus the validator SPEC §8 clause 1
      # calls "the test" — which since v0.9.0 also decides clause 4. PUBLIC + anonymous, so the
      # caller stays forkable. The caller passes `main` off a pre-tag reading's `subjects` answer, or
      # the commit step 0 recorded on the pre-tag reading: metalog-spec is on a deliberately
      # decoupled version line and never carries the uniform vX.Y.Z tag, so a tag ref would 404.
      - name: Check out metalog-spec into _spec/ (the schema + its validator; PUBLIC, anonymous)
        if: ${{ inputs.spec-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CodeRoasted/metalog-spec
          path: _spec
          ref: ${{ inputs.spec-ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download every leg's digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: golden-digest-*

      - name: Compare + validate the golden (every leg must be byte-identical)
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-golden-compare@6d64666cbf45d76c8329d586922458d5019bb6ff
        with:
          digests-dir: digests
          min-legs: ${{ inputs.min-legs }}
          out: ${{ github.workspace }}/determinism-golden.txt

      - name: Set up Python for the validator
        if: ${{ inputs.spec-ref != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the validator's oracle (the pinned requirements, never a hand-picked subset)
        if: ${{ inputs.spec-ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r _spec/conformance/requirements.txt

      - name: SPEC §8 clauses 1 and 4 over the agreed golden (GATING — before the upload)
        if: ${{ inputs.spec-ref != '' }}
        shell: bash
        run: bash scripts/spec_conformance_gate.sh
        env:
          GOLDEN: ${{ github.workspace }}/determinism-golden.txt
          SPEC_ROOT: ${{ github.workspace }}/_spec

      - name: Upload the validated golden (the Release attaches it)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-golden
          path: determinism-golden.txt
          if-no-files-found: error
