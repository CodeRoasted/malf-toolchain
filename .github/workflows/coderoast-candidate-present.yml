name: CodeRoast Candidate Present

# The first job of a repository's candidate (DN-142.D31 (2)): its candidate key, the SHA-256 of
# canonical {repository, tree, upstream}, and whether the repository's own store already holds that
# candidate. PRESENT is the no-op: the caller then starts no other job, so a relaunch at a stored
# commit starts no container and no compiler (P2). The test reads ghcr, never a runner's cache, so a
# hosted runner and the release runner answer it identically (item 6). It first reads the push's
# package guard (visibility and link, THE ONE RULE), so a package the store job would refuse reds here,
# in seconds, never after the build; the push still guards, since a setting can change between the two.
# Then every upstream candidate the upstream document names must be stored and verified in its own store
# (DN-142.D31 (2)): a dependent candidate never starts over an absent upstream, and its golden reads the
# commit each one records.
# Before both, it refuses a run off `refs/heads/main`, the store job's own refusal read first for the same reason.
#
# Trust: a PUBLIC repository's index counts only through its GitHub artifact attestation, signed by
# malf's `coderoast-candidate.yml` at this very malf commit, from `refs/heads/main` of the repository
# itself (DN-142.D31 (4)); a failed verification reads as ABSENT, never as a red. A PRIVATE repository
# has no attestation (item 6), so its index is read with `--private`, judged by digest. Every
# identity is derived from the run (`github.repository`, the malf commit the run references): no
# organisation is named here, so a fork runs the same computation over its own store (P7).

on:
  workflow_call:
    inputs:
      upstream:
        description: 'The upstream document, a JSON object {<owner>/<repository>: <candidate key>}; `{}` for a repository with no first-party upstream.'
        type: string
        required: false
        default: '{}'
      sources:
        description: 'The source-only upstreams, a JSON object {<owner>/<repository>: <commit>} (repositories whose recipes are required and which ship no package); `{}` for none.'
        type: string
        required: false
        default: '{}'
      runs-on:
        description: 'Runner label. Defaults to hosted ubuntu-24.04. PUBLIC callers omit it; PRIVATE callers pass their self-hosted label.'
        type: string
        required: false
        default: 'ubuntu-24.04'
    secrets:
      PACKAGE_PEEK_TOKEN:
        description: 'PRIVATE callers: a classic token holding read:packages alone, for the package guard''s metadata read (a GITHUB_TOKEN reads no link of a private package). PUBLIC callers pass nothing.'
        required: false
    outputs:
      key:
        description: 'The candidate key.'
        value: ${{ jobs.present.outputs.key }}
      present:
        description: '`true` when the store holds this candidate (the no-op), `false` otherwise.'
        value: ${{ jobs.present.outputs.present }}
      upstream-commits:
        description: 'The commit each upstream candidate records, a JSON object {<repository name>: <commit>}; `{}` for none.'
        value: ${{ jobs.present.outputs.upstream-commits }}

permissions:
  contents: read
  # The run's referenced workflows, read by `coderoast-malf-checkout` to find this workflow's commit.
  actions: read
  # A private repository's store is read with the job's token; a public one would also read anonymously.
  packages: read
  attestations: read

jobs:
  present:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      key: ${{ steps.present.outputs.key }}
      present: ${{ steps.present.outputs.present }}
      upstream-commits: ${{ steps.upstream.outputs.commits }}
    steps:
      - name: Refuse unless main
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::a candidate stores only from refs/heads/main, and this run is on $REF (DN-142.D31 (4)): a store a non-main run wrote would be read as absent anyway"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: malf at this workflow's commit, as git
        id: malf
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-malf-checkout@ac9f2e7fa76e20540ce937b2835c3b4e4d291e07
        with:
          workflow: coderoast-candidate-present.yml

      - name: The pinned gh the attestation reads run through
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gh@ac9f2e7fa76e20540ce937b2835c3b4e4d291e07

      - name: The store package's visibility and link, before anything is built
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MALF_PACKAGE_PEEK_TOKEN: ${{ secrets.PACKAGE_PEEK_TOKEN }}
        run: python3 "$MALF_CHECKOUT/store_transport.py" package-check "$GITHUB_REPOSITORY"

      - name: Every upstream candidate stored and verified in its own store, and the commit it records
        id: upstream
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
          SIGNER_WORKFLOW: ${{ steps.malf.outputs.signer-workflow }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$UPSTREAM" > "$RUNNER_TEMP/upstream.json"
          python3 "$MALF_CHECKOUT/store_transport.py" upstream "$RUNNER_TEMP/upstream.json" "$RUNNER_TEMP/upstream-out.json" \
            --signer-workflow "$SIGNER_WORKFLOW"
          commits="$(python3 - "$RUNNER_TEMP/upstream-out.json" <<'PY'
          import json, sys
          resolved = json.load(open(sys.argv[1]))
          names = [repository.split("/", 1)[1] for repository in resolved]
          if len(set(names)) != len(names):
              sys.exit(f"two upstreams share a repository name ({sorted(names)}): the commits output is keyed by name")
          print(json.dumps({repository.split("/", 1)[1]: entry["commit"] for repository, entry in resolved.items()},
                           sort_keys=True, separators=(",", ":")))
          PY
          )"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"

      - name: The candidate key, and whether the store holds it (ghcr only)
        id: present
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
          SOURCES: ${{ inputs.sources }}
          PRIVATE: ${{ github.event.repository.private }}
          SIGNER_WORKFLOW: ${{ steps.malf.outputs.signer-workflow }}
          SIGNER_DIGEST: ${{ steps.malf.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$UPSTREAM" > "$RUNNER_TEMP/upstream.json"
          printf '%s' "$SOURCES" > "$RUNNER_TEMP/sources.json"
          key="$(python3 "$MALF_CHECKOUT/store_transport.py" candidate-key "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/upstream.json" \
            --sources "$RUNNER_TEMP/sources.json")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if [ "$PRIVATE" = true ]; then
            trust=(--private)
          else
            trust=(--signer-workflow "$SIGNER_WORKFLOW" --signer-digest "$SIGNER_DIGEST")
          fi
          rc=0
          python3 "$MALF_CHECKOUT/store_transport.py" candidate-present "$GITHUB_REPOSITORY" "$key" "${trust[@]}" || rc=$?
          case "$rc" in
            0) echo "present=true" >> "$GITHUB_OUTPUT"
               echo "NO-OP — candidate-$key of $GITHUB_REPOSITORY is stored and verified; no other job starts" ;;
            3) echo "present=false" >> "$GITHUB_OUTPUT"
               echo "candidate-$key of $GITHUB_REPOSITORY is absent: the candidate runs" ;;
            *) echo "::error::store_transport candidate-present exited $rc (above): neither PRESENT nor ABSENT was established"
               exit "$rc" ;;
          esac
