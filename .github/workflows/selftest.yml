name: Selftest

# malf-toolchain's FIRST self-CI. Every other workflow here is a REUSABLE one that other
# repos call; nothing ever tested this repo's own contents. That is a sharp gap, because
# `malf` is ~1900 lines of bash that every C++ build in the workspace runs through: a
# syntax error or a dangling dispatch arm here breaks every repo at once, and bash finds
# neither until the offending line executes.
#
# Deliberately a FLOOR, not coverage — syntax, dispatch integrity, and the profile/build
# key truth table (which decide which conan cache a build reads and which build-<key>/ tree
# it writes; getting those wrong is silent, not loud). See tests/test_malf.sh for why each
# check earns its place.
#
# Hosted `ubuntu-latest`: this repo is PUBLIC, and the job needs no secret and no build — bash,
# python3 and a hash-locked conan (the one network fetch), and runs in about a minute.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malf-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Conan from setup-build-env's hash lock, into a job-scoped venv
        # The recipe-exports arms (tests/test_malf.sh [7q7e], DN-142.D4 (b)) run real `conan export`s.
        # The same lock and the same refusals as setup-build-env: every file one of its digests, no
        # build from source.
        run: |
          set -euo pipefail
          version="$(awk '/^  conan-version:/{f=1} f && /default:/{gsub(/[^0-9.]/, "", $2); print $2; exit}' .github/actions/setup-build-env/action.yml)"
          python3 -S -m venv "$RUNNER_TEMP/conan-venv"
          "$RUNNER_TEMP/conan-venv/bin/python" -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: -r ".github/actions/setup-build-env/conan-$version.txt"
          mkdir -p "$RUNNER_TEMP/conan-bin"
          ln -s "$RUNNER_TEMP/conan-venv/bin/conan" "$RUNNER_TEMP/conan-bin/conan"
          echo "$RUNNER_TEMP/conan-bin" >> "$GITHUB_PATH"

      - name: malf selftest (syntax + dispatch integrity + profile/build keys)
        run: bash tests/test_malf.sh

      - name: setup-build-env installs every registry profile into the home, by malf's own sync (DN-142.D23)
        # Its own step until tests/test_malf.sh carries it.
        run: bash tests/test_setup_build_env.sh

      - name: the proof bricks register malf's recipe overlay first, the MSVC spelling held equal to malf's (DN-142.D17 (8))
        # Its own step until tests/test_malf.sh carries it.
        run: bash tests/test_proof_bricks.sh

      - name: conan_module.sh lifts a hosted runner's user-namespace restriction, and nothing on a self-hosted one
        # Its own step until tests/test_malf.sh carries it.
        run: bash tests/test_conan_module.sh

      - name: global.conf renders with HOME unset, as on a Windows runner
        # Its own step until tests/test_malf.sh carries it.
        run: bash tests/test_global_conf.sh

      - name: the store writer's public key, as the release job's verifier reads it (DN-142.D8, D9)
        # Its own step until tests/test_malf.sh carries it.
        run: bash tests/test_store_key.sh

      - name: the golden's agreement is the compare job's verdict, so its upload follows the compare (DN-142.D25 (5), call A)
        run: bash tests/test_golden_compare_shape.sh

      - name: attest admits a step-0 run only at a candidate of its version, naming that candidate, at a commit main contains (DN-108.D36 (15))
        run: bash tests/test_attest_listing.sh

      - name: store_publish selftest (a release job's fetch, verify and stage, against an in-process registry)
        # Its own step until tests/test_malf.sh carries it beside store_replica's and store_manifest's.
        run: timeout 120 python3 store_publish.py selftest
