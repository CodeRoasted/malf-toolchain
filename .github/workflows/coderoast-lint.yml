name: CodeRoast Lint

# Shared lint gate for every CodeRoast repo, as a reusable workflow: actionlint over the caller's
# workflows, the C++23 module-conformance gate over the caller's own module units, and the
# clang-format conformance gate over the caller's C++ sources. All three are per-repo-local and
# toggle true/false (default true). Replaces the copy-pasted-and-drifted per-repo workflow-lint.yml,
# and lets every C++ package repo self-check its modules and its formatting on its own PRs.
#
# Every toggle DEFAULTS TRUE, deliberately: a repo that says nothing is gated, and a hole is a
# written line in that repo's own lint.yml stating which gate is off and why. The inverse — default
# false, opt in — makes a missing gate indistinguishable from a deliberate one, and a new repo
# silently ungated.
#
# `malf lint` (clang-tidy) IS here since 2026-08-30, and the paragraph it replaced said it could
# never be — so the reversal is recorded rather than quietly overwritten. That paragraph read: it
# needs a compile database and clang-21 module BMIs, so it needs a BUILD, and this workflow only
# checks out; `malf format --check` has no such dependency, which is why the two source gates split
# across two homes. Every clause of that is still TRUE. What changed is the ruling about which cost
# is worth paying (Founder, 2026-08-30): "lint and format go together, because adding nolint and
# stuff tend to break formatting" — a `NOLINT` insertion reflows its own line, so the two questions
# are coupled at the point of repair and ONE run must answer both. Split across workflows or
# triggers, a lint fix passes the run that executed and breaks the one that did not.
#
# SO THIS WORKFLOW NOW BUILDS, and that is its largest cost by an order of magnitude. The build is
# clang-21/libc++, not the gcc-16 ship leg, because `malf lint` refuses a foreign compile database
# — clang-tidy reading a gcc database emits findings that are well-formed and wrong. Conan binaries
# are package_id-keyed on the compiler, so the published gcc-16 cache warms nothing and the
# third-party closure builds from source. Measured before/after is in the `lint` input below.
#
# Cross-repo determinism gates (wall-clock, RNG) are NOT here — they span multiple repos and only the
# superproject can run them; it wires them as its own chained jobs.

on:
  workflow_call:
    inputs:
      actionlint:
        description: 'Run actionlint over the caller repo workflows.'
        type: boolean
        required: false
        default: true
      module-conformance:
        description: 'Run the C++23 module-conformance gate over the caller repo module units. Set false for a repo with no .cppm (e.g. the superproject, a TS repo).'
        type: boolean
        required: false
        default: true
      format-check:
        description: |
          Run `malf format --check` (clang-format --dry-run --Werror) over the caller repo C++ sources.
          Set false ONLY for a repo carrying pre-existing violations, and say so in the caller with the
          file count and the owner — an unexplained false is indistinguishable from an oversight. Also
          false for a repo with no C++ (a TS repo), where the walk finds nothing and the gate is inert.
        type: boolean
        required: false
        default: true
      dead-symbol-check:
        description: |
          Fail when the change deletes the last code occurrence of an identifier a comment still
          names in backticks (CLAUDE.md § Comments — a comment restating a symbol is a mirror with
          no enforced edge). Diff-scoped, so it only ever considers identifiers THIS change removed;
          a pre-existing tree is never swept. Set false only for a repo with no C++.
        type: boolean
        required: false
        default: true
      dead-symbol-base:
        description: |
          The commit the dead-symbol diff is taken FROM. Empty (the default) keeps `HEAD~1..HEAD`.

          WHY THIS INPUT EXISTS. Diff scope is the whole reason this gate is usable at all — a
          whole-tree sweep flagged 119 of 1289 candidates, almost all legitimate — but a diff has
          a BASE, and `HEAD~1` is only the right base when the event supplies one. On a
          `pull_request` it does: the checkout is the merge commit, so `HEAD~1` IS the base tip and
          the range is exactly the PR. On a `workflow_dispatch` nothing supplies a base, so
          `HEAD~1..HEAD` means "whatever single commit happens to be on the tip of the dispatched
          ref" — a well-defined range, but not the one an operator dispatching a lint over a branch
          believes they asked for. The verdict is then narrower than it reads, and a verdict read
          wider than it is measured is the failure a green badge is made of.

          So: pass a base here to scope the run deliberately (`main`, a tag, a SHA), and when you
          do not, the job PRINTS a notice on every non-PR event naming both endpoints and saying
          the scope is one commit. The default is unchanged, so no caller's behaviour moves; what
          moves is that the narrow case can no longer be read as the wide one.

          The checkout here is `fetch-depth: 2`, so a base outside that window is not in the clone.
          The compute step fetches it on demand and FAILS NAMING IT if it still cannot be resolved
          — an unresolvable base must never silently fall back to `HEAD~1`, which is the shape that
          turns a deliberate scope into the arbitrary one it was passed to replace.
        type: string
        required: false
        default: ''
      lint:
        description: |
          Run `malf lint --all-files` (clang-tidy) over the caller repo's SHIPPING C++ sources, in
          THIS job, beside `malf format --check` — see the ruling in the header.

          THIS IS THE EXPENSIVE ONE, and the number belongs where the toggle is. Measured
          2026-08-30 by dispatch, before -> after on this job, same commit:
            · coderoast-ipc       hosted   32 s ->  159 s  (+120 s)   5.0x   4 of 4 sources, GREEN
            · coderoast-security  fleet    13 s ->  281 s  (+237 s)  21.6x  16 of 16 TUs,    GREEN
            · insight-canon       hosted   30 s -> 1268 s (+1236 s)  42.3x  56 files,        RED
          The first two are TOWER ROOTS — the smallest builds in the workspace — so they are floors,
          not typical costs. insight-canon is the first repo here with a real dependency graph, and
          21 minutes is what this leg costs when the third-party closure has to be built from source,
          which it always does: conan binaries are package_id-keyed on the compiler and only the
          gcc-16 cache is published, so nothing warms a clang leg.

          WHAT THE COST BUYS, since a 42x multiplier needs one: canon's red is SIX error-grade
          diagnostics in four files that no instrument had ever looked at —
          bugprone-unchecked-optional-access twice in the published `canon.spi.cppm`,
          bugprone-exception-escape three times, bugprone-implicit-widening once.

          TRIGGER CADENCE IS THE OTHER HALF OF THE COST, and it is small: measured across all eight
          C++ repos, ONE pull request since 2026-07-01. On a main-only trunk `pull_request` is
          effectively dead, no repo carries a push trigger, and no release tag runs this workflow
          since the Founder's 2026-09-28 ruling (ADR-2.D3): the cut's step 0, `pharos build`'s B4
          stage, runs every leg a caller arms at the SHA the tag must carry, and the attestation
          makes that verdict the tag's. What still calls this workflow is a caller's dispatch or
          pull request.

          A repo whose first-party requires live in ANOTHER repo declares those repos in
          `lint-siblings`, and the build then covers its whole first-party closure from source —
          the larger cost the Founder ruled worth paying on 2026-09-11 ("Turn it on").

          Set false only for a repo with no C++. Never set it false to silence findings: a red here
          is the gate working.
        type: boolean
        required: false
        default: true
      lint-siblings:
        description: |
          The CodeRoasted repos this repo's first-party BUILD closure reaches (requires and
          test_requires, from every node, minus its own packages), whitespace-separated. Empty keeps
          the checkout as the whole workspace. Each is cloned from source beside the repo for the
          clang-21 lint build — at the run's tag on a tag event, at `main` otherwise, or at the ref
          an entry pins as `<repo>@<ref>` (a decoupled version line, ADR-1.D6). `pin_coherence.py`
          INV-13 reds a set that does not cover the `packages.yml` closure.
        type: string
        required: false
        default: ''
      runs-on:
        description: 'Runner label for the checks job. Defaults to hosted ubuntu-24.04. PUBLIC callers MUST omit it — a self-hosted runner reachable from a public repo fork PR is an RCE. PRIVATE callers pass vars.CI_RUNS_ON (fallback ubuntu-24.04) to route to the self-hosted fleet.'
        type: string
        required: false
        default: 'ubuntu-24.04'
    secrets:
      lint-checkout-token:
        description: 'Read-only Contents token for PRIVATE lint-siblings. Pass it by name, never `secrets: inherit`, and only from a PRIVATE caller whose siblings include a private repo.'
        required: false

permissions:
  contents: read
  # The runner group a conan cache restore reads (`actions-cache-allowed.sh`): unread, a
  # self-hosted job restores and saves no Actions cache.
  actions: read

concurrency:
  group: coderoast-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap checks are `coderoast-preflight.yml`, the one copy every caller reaches; this workflow
  # adds clang-tidy beside them in the same run, which is the ruling's operative half (a `NOLINT`
  # fix reflows its line and breaks format, so one run answers both). The two jobs do not wait for
  # each other: a red preflight never hides the lint's verdict.
  preflight:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-preflight.yml@ed97053271987df7a48694fb34cc449a08b74593
    with:
      actionlint: ${{ inputs.actionlint }}
      module-conformance: ${{ inputs.module-conformance }}
      format-check: ${{ inputs.format-check }}
      dead-symbol-check: ${{ inputs.dead-symbol-check }}
      dead-symbol-base: ${{ inputs.dead-symbol-base }}
      runs-on: ${{ inputs.runs-on }}

  tidy:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # It is by far the most expensive check here (it builds; see the `lint` input).
      - name: C++ clang-tidy conformance
        if: ${{ inputs.lint }}
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-lint-tidy@ed97053271987df7a48694fb34cc449a08b74593
        with:
          siblings: ${{ inputs.lint-siblings }}
          checkout-token: ${{ secrets.lint-checkout-token }}

      # A SKIPPED GATE MUST NOT LOOK LIKE A PASSED ONE. Every other toggle here defaults true, so
      # `false` is always a deliberate written line in the caller — but the RUN shows a skipped step
      # and a green job, and green is what a reader remembers. An exclusion composed with a silent
      # skip is zero coverage wearing a green badge, which is the mechanism that let "silently
      # unlinted" stand for five weeks before this gate existed. So the absence announces itself in
      # the log, at the coordinate where the coverage is missing.
      #
      # It fires only for a caller that asked for at least one C++ gate, because only there is the
      # absence a hole: a caller with every C++ gate off (sift-action, a TypeScript repository that
      # calls this workflow for actionlint alone) has no C++ for clang-tidy to judge, and a warning
      # on its every run would be a false statement that trains readers to skip the true ones. The
      # message names the C++ gates that DID run, read from the inputs, so it is true for every
      # combination a caller can pass.
      - name: Announce that clang-tidy did NOT run
        if: ${{ !cancelled() && !inputs.lint && (inputs.module-conformance || inputs.format-check || inputs.dead-symbol-check) }}
        env:
          MODULES: ${{ inputs.module-conformance }}
          FORMAT: ${{ inputs.format-check }}
          DEAD_SYMBOL: ${{ inputs.dead-symbol-check }}
        run: |
          echo "::warning title=clang-tidy did not run::${{ github.repository }} passed lint with malf lint DISABLED (lint: false in its caller). This run says nothing about clang-tidy conformance; the C++ gates it did run: module-conformance=${MODULES}, format-check=${FORMAT}, dead-symbol-check=${DEAD_SYMBOL}."

      - name: Save the conan cache clang-tidy's build env restored (third-party only)
        if: ${{ inputs.lint }}
        uses: CodeRoasted/malf-toolchain/.github/actions/conan-cache-save@ed97053271987df7a48694fb34cc449a08b74593
