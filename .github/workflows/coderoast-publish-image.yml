name: CodeRoast publish image

# AN IMAGE IS PUBLISHED AS ITS CANDIDATE STORED IT (DN-142.D33 (3); DN-142.D9): the repository's candidate
# store job built it once from the ship form's stored binary (store_image.py `candidate`) and stored its OCI
# archive under a record of the candidate; the tag COPIES that archive to ghcr.io/<owner>/<image> by digest
# and builds nothing. The caller's `attest` job hands on `key`, the candidate key the cut's record names for
# the repository, and the caller names the image its repository's packages.yml declares under `images:`
# (pin_coherence holds the two equal):
#   store_publish.py image reads the candidate through store_transport's one trusted reader (a public
#   store through its attestations at this workflow's malf commit, a private one through its privacy and
#   the job's token), refuses a candidate whose tree is not the tag's, takes the image's ONE record (its
#   executables the ones packages.yml sites, at the digests of the candidate's own ship-form creates),
#   judges its archive (one linux/amd64 image whose manifest digest is the record's), pushes every blob and
#   the manifest verbatim, so the registry's digest is the one the candidate stored, and tags it with the
#   release tag. A tag already naming another digest is refused, never moved.
#
# ITS OWN WORKFLOW, NOT A JOB OF coderoast-publish.yml, BECAUSE OF ONE PERMISSION: pushing the image
# needs `packages: write`, and a called workflow's permissions must be granted by every caller. In
# the publish workflow that grant would reach every releasing repository, public ones included, for
# a write only the image's repository makes. The image's package is linked to its repository by the
# Dockerfile's source label.
#
# NOTHING HERE CHECKS OUT THE CALLER'S SOURCE, PROVISIONS A TOOLCHAIN, BUILDS OR PACKS: no docker,
# no buildx; the push is store_publish.py's own registry client.

on:
  workflow_call:
    inputs:
      candidate-key:
        description: 'The candidate key the cut''s record names for this repository (the caller''s attest job''s `key` output).'
        type: string
        required: true
      image:
        description: 'The image to publish: a name the repository declares under `images:` in its packages.yml.'
        type: string
        required: true
      runs-on:
        description: 'Runner label. Callers omit it (hosted ubuntu-24.04): the job reads a registry and the GitHub API.'
        type: string
        required: false
        default: 'ubuntu-24.04'

jobs:
  publish-image:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write      # the image's own package; the store package is read with the same token
      actions: read        # coderoast-malf-checkout reads the run's referenced workflows for this workflow's commit
      attestations: read   # a public store's candidate is trusted through its attestations
    steps:
      - name: malf at this workflow's commit, as git (its tools, and the attestation's signer digest)
        id: malf
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-malf-checkout@17652e4b9ccaccd73594167550b15db3e881b64c
        with:
          workflow: coderoast-publish-image.yml

      - name: The pinned gh the attestation reads run through
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gh@17652e4b9ccaccd73594167550b15db3e881b64c

      - name: Read the candidate's image, and push it tagged with the release tag (GATING)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ inputs.candidate-key }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRIVATE: ${{ github.event.repository.private }}
          SIGNER_WORKFLOW: ${{ steps.malf.outputs.signer-workflow }}
          SIGNER_DIGEST: ${{ steps.malf.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          if [ "$PRIVATE" = true ]; then
            trust=(--private)
          else
            trust=(--signer-workflow "$SIGNER_WORKFLOW" --signer-digest "$SIGNER_DIGEST")
          fi
          python3 "$MALF_CHECKOUT/store_publish.py" image "$GITHUB_REPOSITORY" "$TAG" "$KEY" "$IMAGE" "${trust[@]}"
