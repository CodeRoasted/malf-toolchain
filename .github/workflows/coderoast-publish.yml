name: CodeRoast publish

# A RELEASE IS A PUBLICATION (DN-142.D9; N360 plan B1): the tag attaches the bytes step 0 built,
# judged and stored, by digest, and builds nothing. The caller's `attest` job (coderoast-attest.yml,
# the first job of every release workflow, pin_coherence INV-22) proves the tagged commit is the
# commit the step-0 record judged and hands on `record-sha256`, the digest of the record it attested;
# this workflow's one job, `publish`, takes that digest as its input:
#   store_publish.py reads THIS repository's slice for that record from its private ghcr store
#   package (`store-<repository>`, read with the job's own GITHUB_TOKEN, granted Read on that one
#   package, DN-142.D6 R5), verifies the writer's signature against
#   `keys/store-writer.allowed_signers` at this workflow's own revision, refuses a slice that names
#   any other step-0 record or another visibility than the repository's own now (DN-142.D24),
#   fetches every object by its digest (a single-file asset's object is that file's own bytes, never
#   its package's transport, so no private package's sources reach this repository's store
#   package), then attaches the staged files and the signed slice to the Release, and reads the
#   Release back: its assets equal the staged files, both ways. A slice or an object that does not
#   verify stages nothing, and the Release is not created. An image the slice lists is no Release
#   file: `coderoast-publish-image.yml` pushes it.
#
# NOTHING HERE CHECKS OUT THE CALLER'S SOURCE, PROVISIONS A TOOLCHAIN, COMPILES, TESTS OR PACKS:
# stage-malf copies this revision's own tree (the tools and the writer's public key), and the only
# other commands are the publication itself. `--verify-tag` keeps the Release command from ever
# minting a tag; the tag is the Founder's act (ADR-2.D1).

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Package callers omit it (hosted ubuntu-latest): the job reads a registry and the GitHub API, and needs no cache, no slot and no secret beyond its own token.'
        type: string
        required: false
        default: 'ubuntu-latest'
      record-sha256:
        description: 'The digest of the step-0 record the caller''s attest job attested (its `record-sha256` output).'
        type: string
        required: true

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write   # create the Release (never the tag: --verify-tag) and upload its assets
      packages: read    # this repository's own store package, the only one it is granted
    steps:
      - name: Stage malf-toolchain at this workflow's revision (the tools and the writer's public key)
        uses: CodeRoasted/malf-toolchain/.github/actions/stage-malf@9ae2e144d096f0ce2c539585dc08ffd03a91fa7d
        with:
          path: .malf

      - name: Fetch, verify and stage this repository's slice of the attested record (GATING)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECORD: ${{ inputs.record-sha256 }}
          # The second producer of the repository's visibility (DN-142.D24): step 0 read it from the
          # API into the slice, and the job's own event context says what it is now.
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          python3 .malf/store_publish.py stage "${GITHUB_REPOSITORY#*/}" "$VISIBILITY" "$RECORD" \
            .malf/keys/store-writer.allowed_signers "$RUNNER_TEMP/assets"

      - name: Create the Release at the existing tag and attach the staged assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RECORD: ${{ inputs.record-sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Published from the CodeRoast store by digest: the bytes step 0 built and judged in the run whose record has sha256 $RECORD. The attached slice and its signature list every asset's digest." \
            "$RUNNER_TEMP"/assets/*

      - name: Read the Release back — it holds exactly the slice's assets, both ways (GATING)
        # DN-142.D24 (3): a hand-edited workflow that attached one more file would otherwise drift
        # unseen; the reading is made from outside, after the upload, on the Release itself.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/release.json"
          python3 .malf/store_publish.py check-release "$RUNNER_TEMP/assets" "$RUNNER_TEMP/release.json"
