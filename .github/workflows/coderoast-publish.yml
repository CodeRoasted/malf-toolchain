name: CodeRoast publish

# A RELEASE IS A PUBLICATION (DN-142.D9; N360 plan B1): the tag attaches the bytes step 0 built,
# judged and stored, by digest, and builds nothing. Two jobs, the second `needs:` the first:
#   attest  — the tagged commit is the commit the step-0 record judged (coderoast-attest.yml,
#             unchanged); it hands on `record-sha256`, the digest of the record it attested.
#   publish — store_publish.py reads THIS repository's slice for that record from its private ghcr
#             store package (`store-<repository>`, read with the job's own GITHUB_TOKEN, granted
#             Read on that one package, DN-142.D6 R5), verifies the writer's signature against
#             `keys/store-writer.allowed_signers` at this workflow's own revision, refuses a slice
#             that names any other step-0 record, fetches every object by its digest, extracts
#             each single-file asset and checks its digest, then attaches the staged files and the
#             signed slice to the Release. A slice, an object or an entry that does not verify
#             stages nothing, and the Release is not created.
#
# NOTHING HERE CHECKS OUT THE CALLER'S SOURCE, PROVISIONS A TOOLCHAIN, COMPILES, TESTS OR PACKS:
# stage-malf copies this revision's own tree (the tools and the writer's public key), and the only
# other commands are the publication itself. `--verify-tag` keeps the Release command from ever
# minting a tag; the tag is the Founder's act (ADR-2.D1).
#
# NOT YET CALLED: the release workflows move onto it repository by repository (N360 plan B2), and
# it cannot publish until the writer has replicated a cut (store_replica.py push, push-slice) and
# its public key is committed here. Until then a run refuses at the slice, which is the intended
# failure: no slice, no Release.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Package callers omit it (hosted ubuntu-latest): the job reads a registry and the GitHub API, and needs no cache, no slot and no secret beyond its own token.'
        type: string
        required: false
        default: 'ubuntu-latest'
    secrets:
      BUILD_RECORD_READ_TOKEN:
        description: 'Passed to attest unchanged: fine-grained PAT, CodeRoasted/coderoast alone, Actions read-only.'
        required: false

jobs:
  attest:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attest.yml@a545bec5ad7055b6e7407898d20f8ce7621304ee
    with:
      runs-on: ${{ inputs.runs-on }}
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}

  publish:
    needs: attest
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write   # create the Release (never the tag: --verify-tag) and upload its assets
      packages: read    # this repository's own store package, the only one it is granted
    steps:
      - name: Stage malf-toolchain at this workflow's revision (the tools and the writer's public key)
        uses: CodeRoasted/malf-toolchain/.github/actions/stage-malf@a545bec5ad7055b6e7407898d20f8ce7621304ee
        with:
          path: .malf

      - name: Fetch, verify and stage this repository's slice of the attested record (GATING)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECORD: ${{ needs.attest.outputs.record-sha256 }}
        run: |
          set -euo pipefail
          python3 .malf/store_publish.py stage "${GITHUB_REPOSITORY#*/}" "$RECORD" \
            .malf/keys/store-writer.allowed_signers "$RUNNER_TEMP/assets"

      - name: Create the Release at the existing tag and attach the staged assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RECORD: ${{ needs.attest.outputs.record-sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Published from the CodeRoast store by digest: the bytes step 0 built and judged in the run whose record has sha256 $RECORD. The attached slice and its signature list every asset's digest." \
            "$RUNNER_TEMP"/assets/*
