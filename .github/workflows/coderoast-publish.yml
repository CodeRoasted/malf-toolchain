name: CodeRoast publish

# A RELEASE IS A PUBLICATION (DN-142.D9; N360 plan B1): the tag attaches the bytes step 0 built,
# judged and stored, by digest, and builds nothing. The caller's `attest` job (coderoast-attest.yml,
# the first job of every release workflow, pin_coherence INV-22) proves the tagged commit is the
# commit the step-0 record judged and hands on `record-sha256`, the digest of the record it attested;
# this workflow's one job, `publish`, takes that digest as its input:
#   store_publish.py reads THIS repository's slice for that record from its private ghcr store
#   package (`store-<repository>`, read with the job's own GITHUB_TOKEN, granted Read on that one
#   package, DN-142.D6 R5), verifies the writer's signature against
#   `keys/store-writer.allowed_signers` at this workflow's own revision, refuses a slice that names
#   any other step-0 record or another visibility than the repository's own now (DN-142.D24),
#   fetches every object by its digest (a single-file asset's object is that file's own bytes, never
#   its package's transport, so no private package's sources reach this repository's store
#   package), then attaches the staged files and the signed slice to the Release, and reads the
#   Release back: its assets equal the staged files, both ways. A slice or an object that does not
#   verify stages nothing, and the Release is not created. An image the slice lists is no Release
#   file: `coderoast-publish-image.yml` pushes it.
#
# A ROW DESTINED TO A FOREIGN RELEASE (DN-142.D25 (2)) is published by its OWNER's job, from the
# owner's store package: `stage-destinations` fetches the destination slice and its signature by the
# digests the verified owner slice binds, verifies them (the writer's signature; the owner slice's
# record, manifest, version and tag; its rows the projection of the owner's rows), fetches every
# object, and stages them. The publication into the destination runs with the DESTINATION credential
# only (`destination-token`, `contents: write` on that one repository; the job's own token never
# writes there and the destination token never reads the store): mint the annotated tag at the
# destination's default head if missing and read it back as an annotated object (ADR-2.D1), create
# the Release `--verify-tag --latest=false`, attach, then read it back — its assets equal the
# destination slice's files both ways, it is not Latest, and the destination's visibility is the one
# step 0 read (two producers of one fact). An owner slice binding no destination skips this, by its
# own content, never by a flag.
#
# NOTHING HERE CHECKS OUT THE CALLER'S SOURCE, PROVISIONS A TOOLCHAIN, COMPILES, TESTS OR PACKS:
# stage-malf copies this revision's own tree (the tools and the writer's public key), and the only
# other commands are the publication itself. With no checkout there is no git remote, so every `gh`
# that acts on a repository names it with `--repo` (coderoast-security run 38803900222 died
# `fatal: not a git repository` at the v1.10.7 tag without it; workflow_source's repository arm). `--verify-tag` keeps the Release command from ever
# minting a tag; the tag is the Founder's act (ADR-2.D1). A Release that already exists (a re-cut
# force-moved its tag, which re-fires this workflow) is re-published, never re-created: see the step.

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label. Package callers omit it (hosted ubuntu-24.04): the job reads a registry and the GitHub API, and needs no cache, no slot and no secret beyond its own token.'
        type: string
        required: false
        default: 'ubuntu-24.04'
      record-sha256:
        description: 'The digest of the step-0 record the caller''s attest job attested (its `record-sha256` output).'
        type: string
        required: true
    secrets:
      destination-token:
        description: 'The OWNER repository''s secret with `contents: write` on the one foreign repository its slice binds (DN-142.D25 (2)); required exactly when the slice binds a destination.'
        required: false

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write   # create the Release (never the tag: --verify-tag) and upload its assets
      packages: read    # this repository's own store package, the only one it is granted
    steps:
      - name: Stage malf-toolchain at this workflow's revision (the tools and the writer's public key)
        uses: CodeRoasted/malf-toolchain/.github/actions/stage-malf@69bfde55ffe2acc8b236a37357306e7133c43cb3
        with:
          path: .malf

      - name: Fetch, verify and stage this repository's slice of the attested record (GATING)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECORD: ${{ inputs.record-sha256 }}
          # The second producer of the repository's visibility (DN-142.D24): step 0 read it from the
          # API into the slice, and the job's own event context says what it is now.
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          python3 .malf/store_publish.py stage "${GITHUB_REPOSITORY#*/}" "$VISIBILITY" "$RECORD" \
            .malf/keys/store-writer.allowed_signers "$RUNNER_TEMP/assets"

      - name: Create the Release at the existing tag, or re-publish the one a moved tag left, and attach the staged assets
        # A RE-CUT FORCE-MOVES THE TAG (ADR-2.D1) AND THE MOVE RE-FIRES THIS WORKFLOW over the Release a
        # previous run published, so `create` would fail "already exists". An existing Release is
        # re-published instead: its notes name the new record, the staged files replace their namesakes
        # (`--clobber`), every asset the new slice does not list is removed (store_publish.py
        # stale-assets), and a draft (a deleted-and-recreated tag) is published. The read-back below
        # then holds it to the new slice, both ways, exactly as after a create.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RECORD: ${{ inputs.record-sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          notes="Published from the CodeRoast store by digest: the bytes step 0 built and judged in the run whose record has sha256 $RECORD. The attached slice and its signature list every asset's digest."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/existing.json"; then
            echo "the Release $TAG exists (a moved tag re-fired it): re-publishing it from record $RECORD"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$notes" --draft=false
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/assets/*
            python3 .malf/store_publish.py stale-assets "$RUNNER_TEMP/assets" "$RUNNER_TEMP/existing.json" > "$RUNNER_TEMP/stale.txt"
            while IFS= read -r name; do
              echo "removing $name: the slice of record $RECORD does not list it"
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
            done < "$RUNNER_TEMP/stale.txt"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "$notes" \
              "$RUNNER_TEMP"/assets/*
          fi

      - name: Read the Release back — it holds exactly the slice's assets, both ways (GATING)
        # DN-142.D24 (3): a hand-edited workflow that attached one more file would otherwise drift
        # unseen; the reading is made from outside, after the upload, on the Release itself.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release.json"
          python3 .malf/store_publish.py check-release "$RUNNER_TEMP/assets" "$RUNNER_TEMP/release.json"

      - name: Fetch, verify and stage every destination Release the slice binds (GATING)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECORD: ${{ inputs.record-sha256 }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          python3 .malf/store_publish.py stage-destinations "${GITHUB_REPOSITORY#*/}" "$VISIBILITY" "$RECORD" \
            .malf/keys/store-writer.allowed_signers "$RUNNER_TEMP/destinations"

      - name: Publish each destination Release with the destination credential, then read it back (GATING)
        env:
          GH_TOKEN: ${{ secrets.destination-token }}
          OWNER: ${{ github.repository }}
          RECORD: ${{ inputs.record-sha256 }}
        run: |
          set -euo pipefail
          listed="$RUNNER_TEMP/destinations/destinations.tsv"
          if [ ! -s "$listed" ]; then
            echo "the slice binds no destination Release"
            exit 0
          fi
          [ -n "$GH_TOKEN" ] || { echo "::error::the slice binds a destination Release and the caller passed no destination-token"; exit 1; }
          while IFS=$'\t' read -r destination tag visibility; do
            repo="CodeRoasted/$destination"
            seen="$(gh api "repos/$repo" --jq .visibility)"
            [ "$seen" = "$visibility" ] || { echo "::error::$repo is $seen now, and step 0 read it $visibility"; exit 1; }
            if ! gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
              default="$(gh api "repos/$repo" --jq .default_branch)"
              head="$(gh api "repos/$repo/commits/$default" --jq .sha)"
              object="$(gh api "repos/$repo/git/tags" -f tag="$tag" -f type=commit -f object="$head" \
                          -f message="Assets of $OWNER, published from the CodeRoast store by digest (step-0 record sha256 $RECORD)." \
                          --jq .sha)"
              gh api "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
            fi
            if ! kind="$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.type 2>/dev/null)"; then
              kind=MISSING
            fi
            [ "$kind" = "tag" ] || { echo "::error::refs/tags/$tag on $repo is '$kind', not an annotated tag (ADR-2.D1)"; exit 1; }
            notes="Assets of $OWNER, published from the CodeRoast store by digest: the bytes step 0 judged in the run whose record has sha256 $RECORD. The attached destination slice and its signature list every asset's digest."
            if gh release view "$tag" --repo "$repo" --json assets > "$RUNNER_TEMP/destination-existing.json"; then
              echo "the destination Release $tag on $repo exists (the owner's moved tag re-fired it): re-publishing it"
              gh release edit "$tag" --repo "$repo" --title "$tag" --notes "$notes" --draft=false
              gh release upload "$tag" --repo "$repo" --clobber "$RUNNER_TEMP/destinations/$destination"/*
              python3 .malf/store_publish.py stale-assets "$RUNNER_TEMP/destinations/$destination" \
                "$RUNNER_TEMP/destination-existing.json" > "$RUNNER_TEMP/destination-stale.txt"
              while IFS= read -r name; do
                echo "removing $name from $repo $tag: the destination slice does not list it"
                gh release delete-asset "$tag" "$name" --repo "$repo" --yes
              done < "$RUNNER_TEMP/destination-stale.txt"
            else
              gh release create "$tag" --repo "$repo" --verify-tag --latest=false --title "$tag" --notes "$notes" \
                "$RUNNER_TEMP/destinations/$destination"/*
            fi
            gh release view "$tag" --repo "$repo" --json assets > "$RUNNER_TEMP/destination-release.json"
            gh release list --repo "$repo" --limit 1000 --json tagName,isLatest > "$RUNNER_TEMP/destination-releases.json"
            python3 .malf/store_publish.py check-destination "$RUNNER_TEMP/destinations/$destination" \
              "$RUNNER_TEMP/destination-release.json" "$RUNNER_TEMP/destination-releases.json" "$tag"
          done < "$listed"
