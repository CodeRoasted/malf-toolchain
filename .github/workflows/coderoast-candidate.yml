name: CodeRoast Candidate

# A repository's candidate STORE job (DN-142.D31, slice S4), after its CI with the postflight: the
# gcc-16 SHIP FORM of every package the repository releases (`malf store-create --ship`, in the image,
# no test of the package built or run), each bound to the clang source verdict CI wrote by EQUAL
# INPUTS (`artefact_store.py bound`), then every owned object and record pushed to the repository's own
# `store-<repository>` on ghcr, attested, and the index published LAST, so its presence means the
# candidate is complete (DN-142.D31 (2) step 9, (3), (4)).
#
# THIS FILE IS THE ATTESTATION'S SIGNER: a reader verifies `--signer-workflow
# <owner>/<malf>/.github/workflows/coderoast-candidate.yml` at the malf commit the index names, so the
# name of this file and the index's malf commit (this workflow's own, `coderoast-malf-checkout`) are
# one contract with `store_transport.py`.
#
# It refuses unless the run is on `refs/heads/main`, or on a cut's `refs/tags/candidate/...` whose commit main holds
# (DN-142.D31 (4), DN-142.D33: a push to main during the cut then judges nothing). A PUBLIC repository attests
# every pushed manifest (P4); a PRIVATE one runs the same job on its own runner and attests nothing
# (item 6: GitHub attests private repositories only on Enterprise). Every identity is derived from the
# run: no organisation, no secret (P7).

on:
  workflow_call:
    inputs:
      upstream:
        description: 'The upstream document the candidate key was computed over, a JSON object {<owner>/<repository>: <candidate key>}; `{}` for none.'
        type: string
        required: false
        default: '{}'
      sources:
        description: 'The source-only upstreams, a JSON object {<owner>/<repository>: <commit>} (repositories whose recipes are required and which ship no package); `{}` for none.'
        type: string
        required: false
        default: '{}'
      sbom-package-dir:
        description: 'The package whose resolved graph `sbom-path` must match (the repository''s shipped binary). Empty: no SBOM check.'
        type: string
        required: false
        default: ''
      sbom-path:
        description: 'The committed CycloneDX SBOM byte-compared against `sbom-package-dir`''s resolved ship graph (ADR-4.D5, ADR-4.D6). Fix a red with `malf sbom`.'
        type: string
        required: false
        default: ''
      runs-on:
        description: 'Runner label. Defaults to hosted ubuntu-24.04. PUBLIC callers omit it; PRIVATE callers pass their self-hosted label.'
        type: string
        required: false
        default: 'ubuntu-24.04'
    secrets:
      PACKAGE_PEEK_TOKEN:
        description: 'PRIVATE callers: a classic token holding read:packages alone, for the package guard''s metadata read (a GITHUB_TOKEN reads no link of a private package). PUBLIC callers pass nothing.'
        required: false

permissions:
  contents: read
  # The run's referenced workflows (`coderoast-malf-checkout`) and the CI job's store artifact.
  actions: read
  # The repository's own store package, written by its own token (P4).
  packages: write
  # The attestation of every pushed manifest (public repositories only).
  id-token: write
  attestations: write

jobs:
  store:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Refuse unless main, or a cut's candidate tag whose commit main holds
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: bash
        env:
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # note: a cut runs each candidate at its candidate tag, so a push to main during the cut judges nothing (DN-142.D33)
          case "$REF" in
            refs/tags/candidate/*) ;;
            *) echo "::error::a candidate stores only from refs/heads/main or a cut's refs/tags/candidate/..., and this run is on $REF (DN-142.D31 (4), DN-142.D33)"; exit 1 ;;
          esac
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
          case "$status" in
            identical|ahead) echo "$REF names $GITHUB_SHA, on main's history ($status)" ;;
            *) echo "::error::$REF names $GITHUB_SHA, which main does not hold (compare: $status): a candidate is cut from main's history only"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: malf at this workflow's commit, as git
        id: malf
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-malf-checkout@945ec1bb2f90860e1fbc79bb0f5bdd58d1dbcdb3
        with:
          workflow: coderoast-candidate.yml

      - name: The pinned gh the attestation reads run through
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gh@945ec1bb2f90860e1fbc79bb0f5bdd58d1dbcdb3

      - name: The pinned build environment and the host's provisioning tools
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-build-environment@945ec1bb2f90860e1fbc79bb0f5bdd58d1dbcdb3

      - name: The CI job's store (its source verdicts)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-store
          path: ${{ runner.temp }}/candidate-store

      - name: The upstream candidates, read through their own stores, their sources at the commits they record
        if: ${{ inputs.upstream != '{}' }}
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
          SIGNER_WORKFLOW: ${{ steps.malf.outputs.signer-workflow }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          # note: the runner's read cache outlives the job; every hit is re-hashed (store_transport.py, L4)
          MALF_TRANSPORT_CACHE: ${{ runner.tool_cache }}/coderoast-transport
        run: |
          set -euo pipefail
          printf '%s' "$UPSTREAM" > "$RUNNER_TEMP/upstream.json"
          python3 "$MALF_CHECKOUT/store_transport.py" upstream "$RUNNER_TEMP/upstream.json" "$RUNNER_TEMP/upstream-out.json" \
            --sources "$RUNNER_TEMP/upstream" --signer-workflow "$SIGNER_WORKFLOW" \
            --store "$RUNNER_TEMP/candidate-store"
          roots="$(python3 -c 'import json, sys; print(":".join(entry["root"] for entry in json.load(open(sys.argv[1])).values() if "root" in entry))' "$RUNNER_TEMP/upstream-out.json")"
          echo "MALF_UPSTREAM_ROOTS=$roots" >> "$GITHUB_ENV"
          # A private upstream is never cloned: its recipes come through its records' transports (option C).
          mkdir -p "$RUNNER_TEMP/upstream-recipes"
          python3 -c 'import json, sys; json.dump({name: path for entry in json.load(open(sys.argv[1])).values() for name, path in (entry.get("recipes") or {}).items()}, open(sys.argv[2], "w"))' \
            "$RUNNER_TEMP/upstream-out.json" "$RUNNER_TEMP/upstream-recipes/recipes.json"
          if [ "$(cat "$RUNNER_TEMP/upstream-recipes/recipes.json")" != "{}" ]; then
            echo "MALF_UPSTREAM_RECIPES=$RUNNER_TEMP/upstream-recipes/recipes.json" >> "$GITHUB_ENV"
          fi

      - name: The source-only upstreams, cloned at the commits the candidate names
        if: ${{ inputs.sources != '{}' }}
        shell: bash
        env:
          SOURCES: ${{ inputs.sources }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCES" > "$RUNNER_TEMP/sources.json"
          python3 "$MALF_CHECKOUT/store_transport.py" sources "$RUNNER_TEMP/sources.json" "$RUNNER_TEMP/sources-out.json" \
            "$RUNNER_TEMP/sources"
          roots="$(python3 -c 'import json, sys; print(":".join(entry["root"] for entry in json.load(open(sys.argv[1])).values()))' "$RUNNER_TEMP/sources-out.json")"
          echo "MALF_UPSTREAM_ROOTS=${MALF_UPSTREAM_ROOTS:+$MALF_UPSTREAM_ROOTS:}$roots" >> "$GITHUB_ENV"
          # A source-only upstream ships no package to restore: the ship walk creates the ones it needs (malf's _malf_store_steps).
          echo "MALF_UPSTREAM_SOURCES=$roots" >> "$GITHUB_ENV"

      - name: The ship form of every shipped package, in the image, then its binding to the source verdict
        shell: bash
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/candidate-store"
          # note: shipped = each `release: true` package and each package with a `published` executable (an image's binary).
          mapfile -t shipped < <(python3 "$MALF_CHECKOUT/artefact_store.py" shipped "$GITHUB_WORKSPACE")
          [ "${#shipped[@]}" -gt 0 ] \
            || { echo "::error::$GITHUB_REPOSITORY ships no package (packages.yml at HEAD): a candidate stores what a release publishes"; exit 1; }
          echo "shipped: ${shipped[*]}"
          CONAN_HOME="$RUNNER_TEMP/candidate-conan-host" MALF_STORE_DIR="$store" MALF_WORKSPACE_ROOT="$GITHUB_WORKSPACE" \
            bash "$MALF_CHECKOUT/malf" store-create --ship "${shipped[@]}"
          python3 "$MALF_CHECKOUT/artefact_store.py" bound "$store" "${shipped[@]}"

      # A RELEASE PUBLISHES FROM ITS CANDIDATE (DN-142.D33 (3)): every byte a Release attaches, a benchmark
      # alone excepted (the cut measures it), is a record of this store, so what no ship-form create holds is
      # stored here: the tracked files, the hosted outputs of this run's own jobs, the consumer verdicts and the
      # images.
      - name: The tracked files a release publishes (packages.yml `tracked/<member>` objects), read from git at this commit
        shell: bash
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/candidate-store"
          commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          mapfile -t tracked < <(python3 "$MALF_CHECKOUT/artefact_store.py" tracked-packages "$GITHUB_WORKSPACE" "$commit")
          if [ "${#tracked[@]}" -eq 0 ]; then
            echo "$GITHUB_REPOSITORY publishes no tracked file at $commit"
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          for package in "${tracked[@]}"; do
            python3 "$MALF_CHECKOUT/build_environment.py" run --mount "$store" --mount "$GITHUB_WORKSPACE" \
              --read-only-mount "$MALF_CHECKOUT" -- \
              python3 "$MALF_CHECKOUT/artefact_store.py" tracked-step "$store" "$GITHUB_WORKSPACE" "$commit" "$package"
          done

      - name: The hosted outputs a release publishes (packages.yml `ingest:` rows), from the jobs of THIS candidate's run
        # note: a golden's report and insight-eidos's Windows engine are jobs of the caller's candidate.yml, which the store job needs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/candidate-store"
          commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          mapfile -t rows < <(python3 "$MALF_CHECKOUT/artefact_store.py" ingest-rows "$GITHUB_WORKSPACE" "$commit")
          if [ "${#rows[@]}" -eq 0 ]; then
            echo "$GITHUB_REPOSITORY publishes no hosted output at $commit"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/run-artifacts.json"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r workflow artifact _member _class <<<"$row"
            digest="$(python3 -c 'import json, sys; found = [a["digest"] for a in json.load(open(sys.argv[1]))["artifacts"] if a["name"] == sys.argv[2] and a.get("digest")]; print(found[0] if len(found) == 1 else "")' "$RUNNER_TEMP/run-artifacts.json" "$artifact")"
            [ -n "$digest" ] || { echo "::error::this candidate's run carries no one artifact '$artifact' with a digest, which packages.yml's ingest row for $workflow publishes: its job must run in candidate.yml before the store job"; exit 1; }
            folder="$RUNNER_TEMP/ingest/$artifact"
            rm -rf "$folder"; mkdir -p "$folder"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$folder"
            python3 "$MALF_CHECKOUT/artefact_store.py" candidate-ingest "$store" "$GITHUB_WORKSPACE" "$commit" "$workflow" \
              "$folder" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$digest"
          done

      - name: Every consumer verdict packages.yml names, over the ship form's stored entry, in the image
        shell: bash
        run: |
          set -euo pipefail
          python3 "$MALF_CHECKOUT/consumer_verdict.py" candidate "$RUNNER_TEMP/candidate-store" "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/candidate-verdicts"

      - name: Every image packages.yml declares, built from the ship form's stored binary and stored with the candidate
        # note: an image build is declared NON-REPRODUCIBLE (DN-142.D9), so its record is addressed by this run and attempt
        shell: bash
        run: |
          set -euo pipefail
          python3 "$MALF_CHECKOUT/store_image.py" candidate "$RUNNER_TEMP/candidate-store" "$GITHUB_WORKSPACE" \
            "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/candidate-image"

      # The committed SBOM is a projection of the graph this job just resolved for the ship form, so it is checked
      # here, in that job's home, before anything is stored.
      - name: The committed SBOM matches the ship form's resolved graph
        if: ${{ inputs.sbom-path != '' }}
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-sbom-check@945ec1bb2f90860e1fbc79bb0f5bdd58d1dbcdb3
        env:
          CONAN_HOME: ${{ runner.temp }}/candidate-conan-host/cut-verify
        with:
          package-dir: ${{ inputs.sbom-package-dir }}
          sbom-path: ${{ inputs.sbom-path }}

      - name: Push every owned object and record to the repository's own store
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
          SOURCES: ${{ inputs.sources }}
          GITHUB_TOKEN: ${{ github.token }}
          MALF_PACKAGE_PEEK_TOKEN: ${{ secrets.PACKAGE_PEEK_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$UPSTREAM" > "$RUNNER_TEMP/upstream.json"
          printf '%s' "$SOURCES" > "$RUNNER_TEMP/sources.json"
          python3 "$MALF_CHECKOUT/store_transport.py" push "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/candidate-store" "$RUNNER_TEMP/candidate-out" --upstream "$RUNNER_TEMP/upstream.json" \
            --sources "$RUNNER_TEMP/sources.json"

      - name: Attest every pushed manifest (a public repository)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/candidate-out/subjects.sha256

      - name: Publish the index, last
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$MALF_CHECKOUT/store_transport.py" publish-index "$GITHUB_REPOSITORY" "$RUNNER_TEMP/candidate-out"
