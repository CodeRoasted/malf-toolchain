name: CodeRoast Tamys Showcase

# CLIENT-FACING TRANSPARENCY, as one reusable job: install the PUBLIC, sha256-verified `tamys` engine
# through the caller's `install.sh` (the exact binary a user gets), run it over the PUBLIC CI-log
# samples fetched from coderoast-hub with the caller's `scripts/samples_showcase.sh`, and publish the
# render — the run summary and an Actions artifact. It tells the two-part story, silent-on-green and
# regression-catch. NOT a gate: it is evidence a prospective user can inspect.
#
# NEVER A RELEASE ASSET (the Founder, 2026-10-14, DN-142.D25 (4) B). The engine Release is published
# from the artefact store with ONE owner (insight-eidos's publish job) and read back exact both ways;
# a second writer uploading at a time nobody controls would red that reading or race it. The bundle
# stays an Actions artifact and a run summary.
#
# The PLAIN structural diff, never `--explain`: narration in CI is a private dogfood, and a public
# showcase shows the engine's structural verdict, not an LLM narrative.
#
# PUBLIC and anonymous end to end — the engine asset and coderoast-hub are public, no secret is read
# to install or fetch. HOSTED, with no runner input: its one caller (tamys-action) is public, and a
# self-hosted runner a fork can reach is a remote code execution. No `permissions:` here: a called
# workflow can only downgrade its caller's grant, and this one needs `contents: read` only.

on:
  workflow_call:
    inputs:
      tamys-version:
        # NO DEFAULT, deliberately. A literal default once read '1.7.5' while the shipped pin was
        # 1.9.6, so every run that named no version rendered the public showcase on an engine two
        # releases old. Empty resolves to the pin, which follows bump.sh instead of rotting beside it.
        description: 'Published engine version to install (X.Y.Z). Empty: an engine-v<X> release-tag wins, else the pin in the caller''s src/tamys-version.ts.'
        type: string
        required: false
        default: ''
      samples-ref:
        description: 'The coderoast-hub ref holding the samples.'
        type: string
        required: false
        default: 'main'
      release-tag:
        description: 'A Release tag of the caller: an engine-v<X> tag names the engine to install. Nothing is attached to it.'
        type: string
        required: false
        default: ''

jobs:
  showcase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the PUBLIC samples from coderoast-hub (public, anonymous)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CodeRoasted/coderoast-hub
          path: hub
          ref: ${{ inputs.samples-ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install the public tamys engine (download + sha256-verify — the honest client path)
        env:
          TAMYS_VERSION_INPUT: ${{ inputs.tamys-version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          # An explicit version wins; else an engine-v<X> release installs THAT engine; else the PIN,
          # read from src/tamys-version.ts (written ONLY by bump.sh, which pins a PUBLISHED engine), so
          # this arm cannot name a version that does not exist and cannot fall behind the pin.
          VER="$TAMYS_VERSION_INPUT"
          if [ -z "$VER" ]; then
            case "$RELEASE_TAG" in
              engine-v*) VER="${RELEASE_TAG#engine-v}" ;;
              *) VER="$(grep -oE "TAMYS_VERSION[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" src/tamys-version.ts \
                        | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sed -n 1p || true)" ;;
            esac
          fi
          # An unparseable pin is a broken instrument, never a reason to install something else.
          [ -n "$VER" ] || { echo "::error::could not resolve a tamys engine version — no input, no engine-v* release tag, and src/tamys-version.ts did not parse. Refusing to render a showcase on a guessed engine."; exit 1; }
          echo "tamys engine version: $VER"
          # install.sh falls back to ~/.local/bin unless TAMYS_INSTALL_DIR already EXISTS and is
          # writable, so it is created first; install.sh proves liveness itself, fatally.
          mkdir -p "$PWD/bin"
          TAMYS_INSTALL_DIR="$PWD/bin" sh install.sh "$VER"
          echo "TAMYS=$PWD/bin/tamys" >> "$GITHUB_ENV"

      - name: Render the Tamys showcase
        run: bash scripts/samples_showcase.sh "$TAMYS" hub/samples showcase

      - name: Bundle + step summary
        run: |
          set -euo pipefail
          tar --sort=name --mtime='2026-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner \
              -C showcase -czf tamys-samples-showcase.tar.gz .
          {
            echo "## Tamys over our public CI-log samples"
            echo
            cat showcase/README.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamys-samples-showcase
          path: showcase
          if-no-files-found: error

