name: CodeRoast Build

# A CodeRoast repository's CI build, as a reusable workflow: the DEV leg INSIDE the pinned build
# environment (`coderoast-source-verdict`: `malf source-verdict`, a clang-21/libc++ test of every
# package of the repository's own packages.yml, one source-verdict record each; test on clang, ship
# gcc, the Founder, 2026-10-27) and, when `postflight` is true, clang-tidy over that same build in
# the same job (`malf source-lint`, the image's own clang-tidy over the image's trees). The postflight
# builds nothing; it runs here because only this job holds the build it reads, and it runs even after
# a red test (`!cancelled()`), so a run answers both questions (DN-142.D31 (1)).
#
# The run's store (the source-verdict records) is uploaded as the artifact `candidate-store`, which a
# candidate's store job (`coderoast-candidate.yml`) downloads to bind the gcc packages it creates to
# these verdicts. The gcc-16 ship leg is not here: it is that store job.
#
# The walk reads the repository's own checkout and this workflow's malf, nothing else (DN-142.D31
# (5)); a public caller names no organisation and holds no secret (P7).

on:
  workflow_call:
    inputs:
      postflight:
        description: 'Run clang-tidy (`malf source-lint`) over the dev build, in this job.'
        type: boolean
        required: false
        default: false
      upstream:
        description: 'The upstream document, a JSON object {<owner>/<repository>: <candidate key>}; `{}` for a repository with no first-party upstream.'
        type: string
        required: false
        default: '{}'
      sources:
        description: 'The source-only upstreams, a JSON object {<owner>/<repository>: <commit>} (repositories whose recipes are required and which ship no package); `{}` for none.'
        type: string
        required: false
        default: '{}'
      runs-on:
        description: 'Runner label. Defaults to hosted ubuntu-24.04. PUBLIC callers omit it. PRIVATE callers pass their self-hosted label.'
        type: string
        required: false
        default: 'ubuntu-24.04'

permissions:
  contents: read
  # The run's referenced workflows, read by `coderoast-malf-checkout` to find this workflow's commit.
  actions: read
  # A private upstream's store is read with this job's token (DN-142.D31 (2), option C): a called workflow's
  # declaration caps its token, so the caller's grant does not reach this job unless it is declared here.
  packages: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: malf at this workflow's commit, as git
        id: malf
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-malf-checkout@17652e4b9ccaccd73594167550b15db3e881b64c
        with:
          workflow: coderoast-build.yml

      - name: The pinned gh the attestation reads run through
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gh@17652e4b9ccaccd73594167550b15db3e881b64c

      - name: The pinned build environment and the host's provisioning tools
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-build-environment@17652e4b9ccaccd73594167550b15db3e881b64c

      - name: The upstream candidates, read through their own stores, their sources at the commits they record
        if: ${{ inputs.upstream != '{}' }}
        shell: bash
        env:
          UPSTREAM: ${{ inputs.upstream }}
          SIGNER_WORKFLOW: ${{ steps.malf.outputs.signer-workflow }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          # note: the runner's read cache outlives the job; every hit is re-hashed (store_transport.py, L4)
          MALF_TRANSPORT_CACHE: ${{ runner.tool_cache }}/coderoast-transport
        run: |
          set -euo pipefail
          printf '%s' "$UPSTREAM" > "$RUNNER_TEMP/upstream.json"
          python3 "$MALF_CHECKOUT/store_transport.py" upstream "$RUNNER_TEMP/upstream.json" "$RUNNER_TEMP/upstream-out.json" \
            --sources "$RUNNER_TEMP/upstream" --signer-workflow "$SIGNER_WORKFLOW" --store "$RUNNER_TEMP/upstream-recipes/store"
          roots="$(python3 -c 'import json, sys; print(":".join(entry["root"] for entry in json.load(open(sys.argv[1])).values() if "root" in entry))' "$RUNNER_TEMP/upstream-out.json")"
          echo "MALF_UPSTREAM_ROOTS=$roots" >> "$GITHUB_ENV"
          # A private upstream is never cloned: its recipes come through its records' transports (option C).
          mkdir -p "$RUNNER_TEMP/upstream-recipes"
          python3 -c 'import json, sys; json.dump({name: path for entry in json.load(open(sys.argv[1])).values() for name, path in (entry.get("recipes") or {}).items()}, open(sys.argv[2], "w"))' \
            "$RUNNER_TEMP/upstream-out.json" "$RUNNER_TEMP/upstream-recipes/recipes.json"
          if [ "$(cat "$RUNNER_TEMP/upstream-recipes/recipes.json")" != "{}" ]; then
            echo "MALF_UPSTREAM_RECIPES=$RUNNER_TEMP/upstream-recipes/recipes.json" >> "$GITHUB_ENV"
          fi

      - name: The source-only upstreams, cloned at the commits the candidate names
        if: ${{ inputs.sources != '{}' }}
        shell: bash
        env:
          SOURCES: ${{ inputs.sources }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCES" > "$RUNNER_TEMP/sources.json"
          python3 "$MALF_CHECKOUT/store_transport.py" sources "$RUNNER_TEMP/sources.json" "$RUNNER_TEMP/sources-out.json" \
            "$RUNNER_TEMP/sources"
          roots="$(python3 -c 'import json, sys; print(":".join(entry["root"] for entry in json.load(open(sys.argv[1])).values()))' "$RUNNER_TEMP/sources-out.json")"
          echo "MALF_UPSTREAM_ROOTS=${MALF_UPSTREAM_ROOTS:+$MALF_UPSTREAM_ROOTS:}$roots" >> "$GITHUB_ENV"

      - name: Dev leg in the image (source verdict) and its postflight
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-source-verdict@17652e4b9ccaccd73594167550b15db3e881b64c
        with:
          postflight: ${{ inputs.postflight }}

      # A red dev leg's own logs are in its scratch under the host's /tmp (`malf source-verdict` keeps them and
      # quotes only a bounded tail), so they are uploaded for the reader instead of dying with the runner: its
      # top-level logs only, never the per-step homes beside them (mktemp's 0700, the act's uid; ipc run 40582068634).
      - name: A red dev leg's logs, for its reader
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-verdict-logs
          # ctest's own LastTest.log holds each test's output (a skip's errno, a failure's stderr), which
          # malf's log does not carry (ipc run 40644020936: the namespace probe's errno was in neither).
          path: |
            /tmp/malf-source-verdict.*/*.log
            ${{ github.workspace }}/**/build-*/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
          retention-days: 7

      - name: The run's store, for the candidate's store job (a red leg stores nothing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-store
          path: ${{ env.CANDIDATE_STORE }}
          if-no-files-found: error
          retention-days: 1
