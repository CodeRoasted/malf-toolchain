name: CodeRoast Build

# A CodeRoast repository's CI build, as a reusable workflow: the DEV leg (`coderoast-dev-build`, a
# clang-21/libc++ `malf test` of every package — test on clang, ship gcc, the Founder, 2026-10-27)
# and, when `postflight` is true, clang-tidy over that same build in the same job
# (`coderoast-postflight`). The postflight builds nothing; it runs here because only this job holds
# the build it reads, and a job of its own would start on an empty machine. It runs even after a
# red test (`!cancelled()`), so a run answers both questions.
#
# The gcc-16 ship leg is not here: it is the candidate's store step, which creates the packages a
# release publishes without running their tests again.

on:
  workflow_call:
    inputs:
      postflight:
        description: 'Run clang-tidy (`coderoast-postflight`) over the dev build, in this job.'
        type: boolean
        required: false
        default: false
      test:
        description: 'Run the tests (`malf test`); false builds only.'
        type: boolean
        required: false
        default: true
      siblings:
        description: |
          The CodeRoasted repos this repo's first-party BUILD closure reaches (requires and
          test_requires, from every node, minus its own packages), whitespace-separated; each is
          cloned from source beside the checkout (see `coderoast-dev-build`). `pin_coherence.py`
          INV-13 reds a set that does not cover the `packages.yml` closure.
        type: string
        required: false
        default: ''
      runs-on:
        description: 'Runner label. Defaults to hosted ubuntu-24.04. PUBLIC callers omit it. PRIVATE callers pass vars.CI_RUNS_ON (fallback ubuntu-24.04) to route to the self-hosted fleet.'
        type: string
        required: false
        default: 'ubuntu-24.04'
    secrets:
      checkout-token:
        description: 'Read-only Contents token for PRIVATE siblings. Pass it by name, never `secrets: inherit`, and only from a PRIVATE caller whose siblings include a private repo.'
        required: false

permissions:
  contents: read
  # The runner group a conan cache restore reads (`actions-cache-allowed.sh`): unread, a
  # self-hosted job restores and saves no Actions cache.
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dev build (clang-21) and its tests
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-dev-build@e73787efcf75199aa6aebb38d0d6b5618d93bc4e
        with:
          test: ${{ inputs.test }}
          siblings: ${{ inputs.siblings }}
          checkout-token: ${{ secrets.checkout-token }}

      - name: Postflight — clang-tidy over this build
        if: ${{ !cancelled() && inputs.postflight }}
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-postflight@e73787efcf75199aa6aebb38d0d6b5618d93bc4e

      - name: Save the conan cache the dev build restored (third-party only)
        uses: CodeRoasted/malf-toolchain/.github/actions/conan-cache-save@2bb2e8586f7e45e973623f2e35d60bad11f50b13

      - name: Clear the editable registry and the sibling workspace
        if: always()
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-dev-cleanup@e73787efcf75199aa6aebb38d0d6b5618d93bc4e
