name: CodeRoast Build

# A CodeRoast repository's CI build, as a reusable workflow: the DEV leg INSIDE the pinned build
# environment (`coderoast-source-verdict`: `malf source-verdict`, a clang-21/libc++ test of every
# package of the repository's own packages.yml, one source-verdict record each; test on clang, ship
# gcc, the Founder, 2026-10-27) and, when `postflight` is true, clang-tidy over that same build in
# the same job (`malf source-lint`, the image's own clang-tidy over the image's trees). The postflight
# builds nothing; it runs here because only this job holds the build it reads, and it runs even after
# a red test (`!cancelled()`), so a run answers both questions (DN-142.D31 (1)).
#
# The run's store (the source-verdict records) is uploaded as the artifact `candidate-store`, which a
# candidate's store job (`coderoast-candidate.yml`) downloads to bind the gcc packages it creates to
# these verdicts. The gcc-16 ship leg is not here: it is that store job.
#
# The walk reads the repository's own checkout and this workflow's malf, nothing else (DN-142.D31
# (5)); a public caller names no organisation and holds no secret (P7).

on:
  workflow_call:
    inputs:
      postflight:
        description: 'Run clang-tidy (`malf source-lint`) over the dev build, in this job.'
        type: boolean
        required: false
        default: false
      runs-on:
        description: 'Runner label. Defaults to hosted ubuntu-24.04. PUBLIC callers omit it. PRIVATE callers pass their self-hosted label (the release runner, DN-142.D31 item 6).'
        type: string
        required: false
        default: 'ubuntu-24.04'

permissions:
  contents: read
  # The run's referenced workflows, read by `coderoast-malf-checkout` to find this workflow's commit.
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: malf at this workflow's commit, as git
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-malf-checkout@f0f43b73d4aa9b4604009347f797705adcf4f088
        with:
          workflow: coderoast-build.yml

      - name: The pinned build environment and the host's provisioning tools
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-build-environment@f0f43b73d4aa9b4604009347f797705adcf4f088

      - name: Dev leg in the image (source verdict) and its postflight
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-source-verdict@f0f43b73d4aa9b4604009347f797705adcf4f088
        with:
          postflight: ${{ inputs.postflight }}

      - name: The run's store, for the candidate's store job (a red leg stores nothing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-store
          path: ${{ env.CANDIDATE_STORE }}
          if-no-files-found: error
          retention-days: 1
