name: CodeRoast CI

# The shared CI job for every CodeRoast C++ repo, as a reusable workflow. It wraps the composite
# building block — `coderoast-ci` (checkout + toolchain + build env + cross-repo vendor loop + the
# per-module build/test/create loop) — and owns the job-level shell (runs-on) so callers keep only the
# trigger, permissions, and their two data manifests. A caller becomes ~4 lines: permissions + `uses:` +
# `with: {vendor, modules}` + `secrets: inherit`.
#
# Every C++ repository's CI build job is this workflow, coderoast-server's and insight-eidos's included
# (ROADMAP N357). Their two mid-job steps are slots of it rather than reasons to copy it: `hub-scenarios`
# + `late-modules` export the public coderoast-hub's `insight_scenarios` recipe after `modules` and
# build the modules that test_require it (the server's `server`, eidos's `insight-e2e`), and
# `sbom-path` byte-compares a committed linked-closure SBOM against the resolved graph once every
# module has built (the server's `server/sbom.cdx.json`, eidos's `sift/sbom.cdx.json`; ADR-4.D5, ADR-4.D6).

on:
  workflow_call:
    inputs:
      modules:
        description: 'Newline modules manifest: `<module> [test] [create]` (test/create default true).'
        type: string
        required: true
      vendor:
        description: 'Newline vendor manifest: `<pkg> <ver> <owner/repo> <public|private> [tag]`. Blank = no cross-repo deps.'
        type: string
        required: false
        default: ''
      deps:
        description: 'How the `vendor` rows reach the cache: `vendor` (release tarballs — the release path) or `build` (each created from its repository''s main — a run on an open version). Required whenever `vendor` has a row.'
        type: string
        required: false
        default: ''
      extra-apt:
        description: 'Extra apt packages for the build env (e.g. "libpq-dev redis-tools").'
        type: string
        required: false
        default: ''
      hub-scenarios:
        description: 'Export the public coderoast-hub''s insight_scenarios recipe, at hub main, after `modules` and before `late-modules`. No tag runs this workflow: the hub commit a release records is the one step 0''s candidate holds.'
        type: boolean
        required: false
        default: false
      late-modules:
        description: 'Modules built after the hub export, same grammar as `modules`.'
        type: string
        required: false
        default: ''
      sbom-package-dir:
        description: 'The package whose resolved graph `sbom-path` must match. Empty: no SBOM check.'
        type: string
        required: false
        default: ''
      sbom-path:
        description: 'The committed CycloneDX SBOM byte-compared against `sbom-package-dir`''s resolved graph after every module built. Fix a red with `malf sbom`.'
        type: string
        required: false
        default: ''
      runs-on:
        description: 'Runner label for the build job. Defaults to hosted ubuntu-24.04. PUBLIC callers MUST omit it — a self-hosted runner reachable from a public repo fork PR is an RCE. PRIVATE callers pass vars.CI_RUNS_ON (fallback ubuntu-24.04) to route to the self-hosted fleet.'
        type: string
        required: false
        default: 'ubuntu-24.04'
    secrets:
      CR_RELEASE_TOKEN:
        description: 'Fine-grained PAT (Contents:read) for PRIVATE-repo release reads. Required only if any vendor row is `private`. Pass via `secrets: inherit`.'
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: CI — checkout + toolchain + build env + cross-repo vendor + build/test
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-ci@c5eea4821d482319a031cbaef04c7a1af40af19e
        with:
          vendor: ${{ inputs.vendor }}
          deps: ${{ inputs.deps }}
          modules: ${{ inputs.modules }}
          extra-apt: ${{ inputs.extra-apt }}
          hub-scenarios: ${{ inputs.hub-scenarios }}
          late-modules: ${{ inputs.late-modules }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-token: ${{ secrets.CR_RELEASE_TOKEN }}

      - name: SBOM freshness — the committed SBOM must match the RESOLVED graph
        # Homed after the build because --check re-resolves the graph and here it is materialised.
        # The byte-compare is also what makes the coderoast:cpe-coverage ratio a control: a component
        # entering without a CPE mapping changes the ratio and reds this step.
        if: inputs.sbom-path != ''
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-sbom-check@c5eea4821d482319a031cbaef04c7a1af40af19e
        with:
          package-dir: ${{ inputs.sbom-package-dir }}
          sbom-path: ${{ inputs.sbom-path }}

      - name: Save the conan cache (third-party only; never on the coderoast-release group)
        uses: CodeRoasted/malf-toolchain/.github/actions/conan-cache-save@c5eea4821d482319a031cbaef04c7a1af40af19e

