name: CodeRoast CI

# The shared CI job for every CodeRoast C++ repo, as a reusable workflow. It wraps the two composite
# building blocks — `coderoast-ci` (checkout + toolchain + build env + cross-repo vendor loop + the
# per-module build/test/create loop) and `coderoast-ci-sift` (the standard, advisory Sift dogfood) —
# and owns the job-level shell (runs-on) so callers keep only the trigger, permissions, and their two
# data manifests. A caller becomes ~4 lines: permissions + `uses:` + `with: {vendor, modules}` +
# `secrets: inherit`.
#
# Every C++ repository's CI build job is this workflow, coderoast-server's and insight-eidos's included
# (ROADMAP N357). Their two mid-job steps are slots of it rather than reasons to copy it: `hub-scenarios`
# + `late-modules` export the public coderoast-hub's `insight_scenarios` recipe after `modules` and
# build the modules that test_require it (the server's `server`, eidos's `insight-e2e`), and
# `sbom-path` byte-compares a committed linked-closure SBOM against the resolved graph once every
# module has built (the server's `server/sbom.cdx.json`, eidos's `sift/sbom.cdx.json`; ADR-4.D5/D6).

# Sift dogfood is the standard `sift-action@v1` integration only — the internal courtesy `--explain`
# endpoint is intentionally NOT wired here (retired from in-CI dogfood; the composite still supports it
# opt-in if ever re-armed).

on:
  workflow_call:
    inputs:
      modules:
        description: 'Newline modules manifest: `<module> [test] [create]` (test/create default true).'
        type: string
        required: true
      vendor:
        description: 'Newline vendor manifest: `<pkg> <ver> <owner/repo> <public|private> [tag]`. Blank = no cross-repo deps.'
        type: string
        required: false
        default: ''
      deps:
        description: 'How the `vendor` rows reach the cache: `vendor` (release tarballs — the release path) or `build` (each created from its repository''s main — a run on an open version). Required whenever `vendor` has a row.'
        type: string
        required: false
        default: ''
      extra-apt:
        description: 'Extra apt packages for the build env (e.g. "libpq-dev redis-tools").'
        type: string
        required: false
        default: ''
      sift-mode:
        description: |
          private (diff + post the comment in CI; for PRIVATE/no-fork repos) | public (diff + render the
          `sift-comment` artifact for the coderoast-sift-post workflow to post — fork-safe, for PUBLIC
          repos) | off (no Sift). Public repos also add a thin sift-post.yml that calls coderoast-sift-post.
        type: string
        required: false
        default: 'private'
      sift-job:
        description: 'Sift baseline lineage name for this job (folds into sift-baseline-main-<job> / sift-baseline-<job>-pr-<n>).'
        type: string
        required: false
        default: 'build'
      sift-baseline:
        description: 'Override the Sift vs-main baseline SOURCE (sift-action grammar). Empty = the named main baseline artifact — you stay King of the baseline.'
        type: string
        required: false
        default: ''
      sift-pr-vs-previous:
        description: 'PRs: also diff against the PR''s own previous run (tagged comment, quiet unless significant). true|false.'
        type: string
        required: false
        default: 'true'
      hub-scenarios:
        description: 'Export the public coderoast-hub''s insight_scenarios recipe after `modules`, before `late-modules`: at the release''s recorded commit on a tag (`hub-ref`, refused when absent), at main off a tag.'
        type: boolean
        required: false
        default: false
      hub-ref:
        description: 'The coderoast-hub commit the release build record verified — the release passes its attest job''s `hub` output. Read only on a tag run.'
        type: string
        required: false
        default: ''
      late-modules:
        description: 'Modules built after the hub export, same grammar as `modules`.'
        type: string
        required: false
        default: ''
      sbom-package-dir:
        description: 'The package whose resolved graph `sbom-path` must match. Empty: no SBOM check.'
        type: string
        required: false
        default: ''
      sbom-path:
        description: 'The committed CycloneDX SBOM byte-compared against `sbom-package-dir`''s resolved graph after every module built. Fix a red with `malf sbom`.'
        type: string
        required: false
        default: ''
      runs-on:
        description: 'Runner label for the build job. Defaults to hosted ubuntu-latest. PUBLIC callers MUST omit it — a self-hosted runner reachable from a public repo fork PR is an RCE. PRIVATE callers pass vars.CI_RUNS_ON (fallback ubuntu-latest) to route to the self-hosted fleet.'
        type: string
        required: false
        default: 'ubuntu-latest'
    secrets:
      CR_RELEASE_TOKEN:
        description: 'Fine-grained PAT (Contents:read) for PRIVATE-repo release reads. Required only if any vendor row is `private`. Pass via `secrets: inherit`.'
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: CI — checkout + toolchain + build env + cross-repo vendor + build/test
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-ci@9744a6181f7c1a08484e8e8161601ca2384497ba
        with:
          vendor: ${{ inputs.vendor }}
          deps: ${{ inputs.deps }}
          modules: ${{ inputs.modules }}
          extra-apt: ${{ inputs.extra-apt }}
          hub-scenarios: ${{ inputs.hub-scenarios }}
          hub-ref: ${{ inputs.hub-ref }}
          late-modules: ${{ inputs.late-modules }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-token: ${{ secrets.CR_RELEASE_TOKEN }}

      - name: SBOM freshness — the committed SBOM must match the RESOLVED graph
        # Homed after the build because --check re-resolves the graph and here it is materialised.
        # The byte-compare is also what makes the coderoast:cpe-coverage ratio a control: a component
        # entering without a CPE mapping changes the ratio and reds this step.
        if: inputs.sbom-path != ''
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-sbom-check@9744a6181f7c1a08484e8e8161601ca2384497ba
        with:
          package-dir: ${{ inputs.sbom-package-dir }}
          sbom-path: ${{ inputs.sbom-path }}

      - name: Save the conan cache (third-party only; never on the coderoast-release group)
        uses: CodeRoasted/malf-toolchain/.github/actions/conan-cache-save@9744a6181f7c1a08484e8e8161601ca2384497ba

      - name: Sift dogfood (advisory; never fails the build)
        if: ${{ always() && inputs.sift-mode != 'off' }}
        continue-on-error: true    # the advisory guarantee lives here, at the job-step boundary
        uses: CodeRoasted/malf-toolchain/.github/actions/coderoast-ci-sift@9744a6181f7c1a08484e8e8161601ca2384497ba
        with:
          mode: ${{ inputs.sift-mode == 'public' && 'render' || 'comment' }}
          changed-outcome: ${{ job.status }}   # the NATIVE token — the engine maps it four-class
          job: ${{ inputs.sift-job }}
          baseline: ${{ inputs.sift-baseline }}
          pr-vs-previous: ${{ inputs.sift-pr-vs-previous }}
